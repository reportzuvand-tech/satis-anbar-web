<style>
/* Layout: field-instrument app — sticky header, horizontal section tabs, one column of form cards; report renders as a white A4 sheet */
:root{
  --bg:#EDF1EF; --surface:#FFFFFF; --surface2:#E2E8E5; --ink:#15201D; --muted:#5A6964; --line:#C9D3CF;
  --accent:#0E6A5B; --accent-ink:#FFFFFF; --accent-soft:#D4EAE5;
  --ok:#23704A; --ok-bg:#DAF0E2; --warn:#7F5A00; --warn-bg:#FAEDC4; --bad:#AE2014; --bad-bg:#FADDD8; --idle:#8A9893;
  --paper:#FFFFFF; --paper-ink:#1B1F1E; --paper-line:#B9C2BF; --paper-head:#123B35; --paper-soft:#E6EEEB;
  --f-body:"Noto Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-disp:"Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --f-num:"Roboto Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1513; --surface:#18201D; --surface2:#222C29; --ink:#E3EBE7; --muted:#93A29D; --line:#303C38;
  --accent:#43B9A2; --accent-ink:#04201A; --accent-soft:#173A33;
  --ok:#74D39C; --ok-bg:#173327; --warn:#F0C45E; --warn-bg:#3A2F12; --bad:#FF8E7E; --bad-bg:#3E1D19; --idle:#6F7E79;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1513; --surface:#18201D; --surface2:#222C29; --ink:#E3EBE7; --muted:#93A29D; --line:#303C38;
  --accent:#43B9A2; --accent-ink:#04201A; --accent-soft:#173A33;
  --ok:#74D39C; --ok-bg:#173327; --warn:#F0C45E; --warn-bg:#3A2F12; --bad:#FF8E7E; --bad-bg:#3E1D19; --idle:#6F7E79;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 96px}
.cols2{display:grid;gap:0 16px}
.col{min-width:0}
@media (min-width:1000px){.wrap,header.top .bar,header.top .tabs{max-width:1120px}.cols2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.cols2 .col>.card:first-child{margin-top:0}}
.drop{display:grid;place-items:center;border:2px dashed var(--line);border-radius:var(--r);padding:20px 12px;text-align:center;cursor:pointer;background:var(--bg);color:var(--muted)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.drop b{color:var(--accent)}
.maptbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.maptbl table{border-collapse:collapse;width:100%;font-size:12px}
.maptbl th,.maptbl td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;white-space:nowrap;font-variant-numeric:tabular-nums}
.maptbl th{background:var(--surface2);position:sticky;top:0}
.maptbl td.num{font-family:var(--f-num)}
.fsum{display:flex;gap:8px;flex-wrap:wrap}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .bar{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{font:700 20px/1 var(--f-disp);letter-spacing:.02em;text-transform:uppercase;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font:500 12px/1.3 var(--f-body);letter-spacing:0;text-transform:none;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis}
.save{font-size:12px;color:var(--muted);white-space:nowrap}
.sync{font-size:12px;font-weight:600;white-space:nowrap;color:var(--muted)}.sync.ok{color:var(--ok)}.sync.warn{color:var(--warn)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:42px}
.btn:focus-visible,.tab:focus-visible,.tcard:focus-visible,.dchip:focus-visible,.seg button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chip:focus-visible,.rcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.5}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 12px 8px;max-width:760px;margin:0 auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;padding:8px 12px;border-radius:20px;font:600 14px/1 var(--f-disp);letter-spacing:.03em;text-transform:uppercase;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:6px}
.tab .n{font:500 11px var(--f-num);opacity:.7}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
h2.sec{font:700 22px/1.15 var(--f-disp);text-transform:uppercase;letter-spacing:.02em;margin:22px 0 4px;text-wrap:balance}
p.hint{color:var(--muted);font-size:13px;margin:0 0 14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px;margin-bottom:12px}
.card h3{margin:0;font:700 15px/1.2 var(--f-disp);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:440px){.grid2{grid-template-columns:1fr}}
label.f{display:grid;gap:4px;min-width:0}
label.f>span{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
input,select,textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 11px;min-height:44px}
textarea{min-height:84px;resize:vertical}
input.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* ================= Satış və Anbar — CORE =================
   The same code runs in two places:
   • on the Google Apps Script server (file Core.gs) — the real rules, enforced there;
   • in the app's demo mode (no server) — so the program can be tried without setup.
   saHandle(db,user,action,payload) reads the in-memory database and returns {res, ch}:
   res = answer for the app, ch = changed rows the caller must save. */
var SA_ROLES={isci:"İşçi (satış)",anbardar:"Anbardar",muhasib:"Mühasib",admin:"Rəhbər"};
var SA_ROLE_ALIASES={"işçi":"isci","isci":"isci","satış":"isci","anbardar":"anbardar","mühasib":"muhasib","muhasib":"muhasib","mühasibat":"muhasib","rəhbər":"admin","rehber":"admin","admin":"admin","müdir":"admin"};
var SA_CAN={
  seeCost:function(r){return r==="muhasib"||r==="admin"},        /* gəliş qiyməti, mənfəət */
  editItem:function(r){return r==="anbardar"||r==="muhasib"||r==="admin"},
  setPrice:function(r){return r==="muhasib"||r==="admin"},       /* gəliş + satış qiyməti təyin etmək */
  moveStock:function(r){return r==="anbardar"||r==="admin"},     /* mədaxil / məxaric / düzəliş */
  seeMoves:function(r){return r!=="isci"},
  quote:function(r){return r==="isci"||r==="muhasib"||r==="admin"},
  editAnyQuote:function(r){return r==="muhasib"||r==="admin"},
  linePrice:function(r){return r==="muhasib"||r==="admin"},      /* kataloq malının qiymətini təklifdə dəyişmək */
  unlimitedDisc:function(r){return r==="muhasib"||r==="admin"},
  admin:function(r){return r==="admin"}
};
var SA_STATUS={draft:"Qaralama",sent:"Göndərildi",accepted:"Qəbul edildi",rejected:"İmtina",done:"Təhvil verildi"};
var SA_KIND={in:"Mədaxil",out:"Məxaric",adj:"Düzəliş"};
var SA_CATS=["UPS","Akkumulyator","Stabilizator","Dizel generator","Elektrik paneli / ATS","Ehtiyat hissə","Kabel və aksesuar","Xidmət"];
var SA_UNITS=["ədəd","dəst","metr","kq","litr","saat","xidmət"];
var SA_DEFAULTS={co:"ZUVAND Grand System",coaddr:"",cotel:"",coemail:"",covoen:"",bank:"",prefix:"TK",valid:15,vat:18,maxDisc:10,
  pay:"50% avans, qalan 50% təhvil-təslimdən sonra 5 iş günü ərzində",
  delivery:"Anbarda olan mallar — 3 iş günü; sifarişlə gətirilən mallar — 4–6 həftə",
  warranty:"Avadanlıq üçün istehsalçı zəmanəti — 12 ay; görülən işlərə — 6 ay",note:""};
var SA_SETTING_KEYS=Object.keys(SA_DEFAULTS);

function saNum(v){if(v===null||v===undefined||v==="")return 0;if(typeof v==="number")return isFinite(v)?v:0;
  var n=parseFloat(String(v).replace(/\s/g,"").replace(",","."));return isFinite(n)?n:0}
function saR2(n){return Math.round((n+Number.EPSILON)*100)/100}
function saId(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function saRole(v){var k=String(v||"").trim().toLowerCase();return SA_ROLE_ALIASES[k]||(SA_ROLES[k]?k:"")}
function saStr(v,max){return String(v==null?"":v).slice(0,max||500)}

function saLineSum(l){return saR2(saNum(l.qty)*saNum(l.price)*(1-saNum(l.disc)/100))}
function saTotals(q){var gross=0,net=0;(q.lines||[]).forEach(function(l){gross+=saR2(saNum(l.qty)*saNum(l.price));net+=saLineSum(l)});
  net=saR2(net);gross=saR2(gross);var rate=q.vat===false?0:saNum(q.vatRate);var vat=saR2(net*rate/100);
  return {gross:gross,disc:saR2(gross-net),net:net,rate:rate,vat:vat,total:saR2(net+vat)}}

/* stock: q = qalıq (in − out ± adj), r = rezerv (accepted quotes, not yet issued), a = mövcud */
function saIssued(db){var m={};db.moves.forEach(function(x){if(x.del||x.kind!=="out"||!x.quoteId)return;var k=x.quoteId+"|"+x.itemId;m[k]=(m[k]||0)+saNum(x.qty)});return m}
function saQuoteNeed(q,items){var need={};(q.lines||[]).forEach(function(l){if(!l.itemId)return;var it=items[l.itemId];if(!it||it.svc)return;need[l.itemId]=(need[l.itemId]||0)+saNum(l.qty)});return need}
function saStock(db){var S={},items={};db.items.forEach(function(i){items[i.id]=i;S[i.id]={q:0,r:0,a:0}});
  db.moves.forEach(function(m){if(m.del||!S[m.itemId])return;var n=saNum(m.qty);S[m.itemId].q+=m.kind==="out"?-n:n});
  var iss=saIssued(db);
  db.quotes.forEach(function(q){if(q.del||q.status!=="accepted")return;var need=saQuoteNeed(q,items);
    Object.keys(need).forEach(function(id){if(!S[id])return;S[id].r+=Math.max(0,need[id]-(iss[q.id+"|"+id]||0))})});
  Object.keys(S).forEach(function(id){var s=S[id];s.q=saR2(s.q);s.r=saR2(s.r);s.a=saR2(s.q-s.r)});return S}
function saRemaining(db,q){var items={};db.items.forEach(function(i){items[i.id]=i});var need=saQuoteNeed(q,items),iss=saIssued(db),out={};
  Object.keys(need).forEach(function(id){out[id]={need:need[id],issued:iss[q.id+"|"+id]||0,left:Math.max(0,saR2(need[id]-(iss[q.id+"|"+id]||0)))}});return out}

function saPubItem(i,role){var o={};for(var k in i)o[k]=i[k];if(!SA_CAN.seeCost(role)){delete o.cost}return o}
function saPubMove(m,role){var o={};for(var k in m)o[k]=m[k];if(!SA_CAN.seeCost(role))delete o.cost;return o}
function saSummary(q){var t=saTotals(q);return {id:q.id,no:q.no||"",date:q.date||"",status:q.status||"draft",client:(q.cl&&q.cl.name)||"",cl:q.cl||{},subj:q.subj||"",
  net:t.net,total:t.total,n:(q.lines||[]).length,author:q.author||"",by:q.by||"",updatedAt:q.updatedAt||0}}
function saSettings(db){var s={};SA_SETTING_KEYS.forEach(function(k){s[k]=db.settings[k]!==undefined&&db.settings[k]!==""?db.settings[k]:SA_DEFAULTS[k]});
  ["valid","vat","maxDisc"].forEach(function(k){s[k]=saNum(s[k])});return s}

function saErr(code,extra){var e=new Error(code);e.code=code;if(extra)e.extra=extra;throw e}

function saHandle(db,u,action,p){
  p=p||{};var role=u.role,now=Date.now(),ch={items:[],moves:[],quotes:[],settings:null};
  var need=function(ok){if(!ok)saErr("forbidden")};
  var itemById=function(id){for(var i=0;i<db.items.length;i++)if(db.items[i].id===id)return db.items[i];return null};
  var quoteById=function(id){for(var i=0;i<db.quotes.length;i++)if(db.quotes[i].id===id&&!db.quotes[i].del)return db.quotes[i];return null};
  var S=saSettings(db);
  switch(action){
  case "ping":return {res:{role:role,name:u.name},ch:ch};

  case "boot":{
    var items=db.items.filter(function(i){return i.active!==false||SA_CAN.editItem(role)}).map(function(i){return saPubItem(i,role)});
    var quotes=db.quotes.filter(function(q){return !q.del}).map(saSummary);
    var res={role:role,name:u.name,settings:S,items:items,stock:saStock(db),quotes:quotes,ts:now};
    if(p.full&&SA_CAN.seeMoves(role)){
      res.moves=db.moves.filter(function(m){return !m.del}).sort(function(x,y){return String(y.date).localeCompare(String(x.date))||(saNum(y.at)-saNum(x.at))}).slice(0,1000).map(function(m){return saPubMove(m,role)});
      res.remaining={};db.quotes.forEach(function(q){if(!q.del&&q.status==="accepted")res.remaining[q.id]=saRemaining(db,q)})}
    return {res:res,ch:ch}}

  case "getQuotes":{var ids=(p.ids||[]).slice(0,40),out=[];ids.forEach(function(id){var q=quoteById(id);if(q)out.push(q)});return {res:{quotes:out},ch:ch}}

  case "getQuote":{var q=quoteById(p.id);if(!q)saErr("notfound");
    return {res:{quote:q,remaining:q.status==="accepted"||q.status==="done"?saRemaining(db,q):null},ch:ch}}

  case "saveQuote":{
    need(SA_CAN.quote(role));var inQ=p.quote||{};var old=inQ.id?quoteById(inQ.id):null;
    if(old){
      if(old.author!==u.name&&!SA_CAN.editAnyQuote(role))saErr("forbidden");
      if(old.status==="done"&&!SA_CAN.admin(role))saErr("locked");
      if(saNum(p.baseAt)&&saNum(old.updatedAt)>saNum(p.baseAt))saErr("conflict",{quote:old})}
    var q={id:old?old.id:(inQ.id||saId("q")),no:old?old.no:"",author:old?old.author:u.name,created:old?old.created:now,
      date:saStr(inQ.date,10),valid:Math.max(1,Math.round(saNum(inQ.valid))||S.valid),status:SA_STATUS[inQ.status]?inQ.status:"draft",
      subj:saStr(inQ.subj,300),cl:{},eng:saStr(inQ.eng,120),engpos:saStr(inQ.engpos,120),engtel:saStr(inQ.engtel,60),
      vat:inQ.vat!==false,vatRate:old?saNum(old.vatRate):S.vat,terms:{},lines:[],updatedAt:now,by:u.name};
    if(SA_CAN.editAnyQuote(role)&&inQ.vatRate!==undefined)q.vatRate=saNum(inQ.vatRate);
    ["name","voen","person","tel","email","addr"].forEach(function(k){q.cl[k]=saStr(inQ.cl&&inQ.cl[k],300)});
    ["pay","delivery","warranty","note"].forEach(function(k){q.terms[k]=saStr(inQ.terms&&inQ.terms[k],2000)});
    var oldLines={};if(old)(old.lines||[]).forEach(function(l){oldLines[l.id]=l});
    (inQ.lines||[]).slice(0,300).forEach(function(l){
      var it=l.itemId?itemById(l.itemId):null;
      var L={id:saStr(l.id||saId("l"),40),itemId:it?it.id:"",code:it?it.code:saStr(l.code,60),name:saStr(l.name||(it&&it.name),300),desc:saStr(l.desc,1000),
        unit:saStr(l.unit||(it&&it.unit)||"ədəd",20),qty:Math.max(0,saNum(l.qty)),price:Math.max(0,saR2(saNum(l.price))),disc:Math.min(100,Math.max(0,saNum(l.disc)))};
      if(it&&!SA_CAN.linePrice(role)){var ol=oldLines[L.id];L.price=ol&&ol.itemId===it.id?saNum(ol.price):saNum(it.price)}
      if(!SA_CAN.unlimitedDisc(role)&&L.disc>S.maxDisc){var ol2=oldLines[L.id];L.disc=ol2&&saNum(ol2.disc)===L.disc?L.disc:S.maxDisc}
      q.lines.push(L)});
    if(!q.no){var y=(q.date||new Date(now).toISOString()).slice(0,4),key="seq"+y,n=saNum(db.settings[key])+1;db.settings[key]=n;
      q.no=(S.prefix||"TK")+"-"+y+"-"+("000"+n).slice(-4);ch.settings={};ch.settings[key]=n}
    if(old){for(var i=0;i<db.quotes.length;i++)if(db.quotes[i].id===q.id)db.quotes[i]=q}else db.quotes.push(q);
    ch.quotes.push(q);return {res:{quote:q,summary:saSummary(q),stock:saStock(db)},ch:ch}}

  case "delQuote":{need(SA_CAN.admin(role));var dq=quoteById(p.id);if(!dq)saErr("notfound");dq.del=true;dq.updatedAt=now;dq.by=u.name;ch.quotes.push(dq);
    return {res:{stock:saStock(db)},ch:ch}}

  case "saveItem":{
    need(SA_CAN.editItem(role));var a=p.item||{},ex=a.id?itemById(a.id):null;
    var code=saStr(a.code,60).trim();if(!code)saErr("code");if(!saStr(a.name).trim())saErr("name");
    for(var j=0;j<db.items.length;j++){var o=db.items[j];if(o.code.toLowerCase()===code.toLowerCase()&&(!ex||o.id!==ex.id))saErr("dupcode")}
    var it2=ex||{id:(a.id&&/^[\w-]{4,60}$/.test(a.id))?a.id:saId("i"),cost:0,price:0,created:now};
    it2.code=code;it2.name=saStr(a.name,300).trim();it2.cat=saStr(a.cat,80);it2.brand=saStr(a.brand,80);it2.model=saStr(a.model,120);
    it2.unit=saStr(a.unit||"ədəd",20);it2.desc=saStr(a.desc,1000);it2.min=Math.max(0,saNum(a.min));it2.svc=!!a.svc;it2.active=a.active!==false;
    if(SA_CAN.setPrice(role)){it2.cost=Math.max(0,saR2(saNum(a.cost)));it2.price=Math.max(0,saR2(saNum(a.price)))}
    it2.updatedAt=now;it2.by=u.name;if(!ex)db.items.push(it2);ch.items.push(it2);
    return {res:{item:saPubItem(it2,role),stock:saStock(db)},ch:ch}}

  case "importItems":{
    need(SA_CAN.setPrice(role));var added=0,updated=0,skipped=0;
    (p.items||[]).slice(0,5000).forEach(function(a){var code=saStr(a.code,60).trim(),name=saStr(a.name,300).trim();if(!code||!name){skipped++;return}
      var ex=null;for(var j=0;j<db.items.length;j++)if(db.items[j].code.toLowerCase()===code.toLowerCase()){ex=db.items[j];break}
      var it=ex||{id:saId("i"),code:code,cost:0,price:0,min:0,svc:false,active:true,created:now,cat:"",brand:"",model:"",unit:"ədəd",desc:""};
      it.name=name;["cat","brand","model","unit","desc"].forEach(function(k){if(a[k]!==undefined&&a[k]!=="")it[k]=saStr(a[k],k==="desc"?1000:120)});
      ["cost","price","min"].forEach(function(k){if(a[k]!==undefined&&a[k]!=="")it[k]=Math.max(0,saR2(saNum(a[k])))});
      if(a.svc!==undefined&&a.svc!=="")it.svc=/^(1|true|bəli|beli|hə|he|x|yes|xidmət)$/i.test(String(a.svc).trim());
      it.updatedAt=now;it.by=u.name;if(ex)updated++;else{db.items.push(it);added++}ch.items.push(it)});
    /* opening balances: "Qalıq" column creates a correction so stock equals the given number */
    var st=saStock(db);(p.items||[]).forEach(function(a){if(a.qty===undefined||a.qty==="")return;var code=saStr(a.code,60).trim().toLowerCase();
      var it=db.items.filter(function(x){return x.code.toLowerCase()===code})[0];if(!it||it.svc)return;var d=saR2(saNum(a.qty)-st[it.id].q);if(!d)return;
      if(!SA_CAN.moveStock(role)&&!SA_CAN.setPrice(role))return;
      var m={id:saId("m"),date:new Date(now).toISOString().slice(0,10),kind:"adj",itemId:it.id,code:it.code,name:it.name,qty:d,cost:saNum(it.cost),doc:"Excel idxalı",party:"",quoteId:"",quoteNo:"",note:"Açılış qalığı / inventar",by:u.name,at:now};
      db.moves.push(m);ch.moves.push(m);st[it.id].q+=d});
    return {res:{added:added,updated:updated,skipped:skipped},ch:ch}}

  case "moves":{need(SA_CAN.seeMoves(role));var lim=Math.min(3000,saNum(p.limit)||800);
    var list=db.moves.filter(function(m){return !m.del}).sort(function(x,y){return String(y.date).localeCompare(String(x.date))||(saNum(y.at)-saNum(x.at))}).slice(0,lim).map(function(m){return saPubMove(m,role)});
    return {res:{moves:list},ch:ch}}

  case "addMoves":{
    need(SA_CAN.moveStock(role));var kind=p.kind;if(!SA_KIND[kind])saErr("kind");
    var opId=/^[\w-]{4,60}$/.test(String(p.opId||""))?String(p.opId):"";
    if(opId&&db.moves.some(function(m){return m.id===opId+"_0"}))return {res:{dup:true,stock:saStock(db)},ch:ch};
    var lines=(p.lines||[]).filter(function(l){return l&&l.itemId&&saNum(l.qty)!==0});if(!lines.length)saErr("empty");
    if(kind==="adj"&&!saStr(p.note).trim())saErr("note");
    var qq=p.quoteId?quoteById(p.quoteId):null;if(p.quoteId&&!qq)saErr("notfound");
    if(qq&&kind==="out"&&qq.status!=="accepted")saErr("notaccepted");
    var st2=saStock(db),rem=qq?saRemaining(db,qq):null,sum={};
    lines.forEach(function(l){var it=itemById(l.itemId);if(!it)saErr("notfound");if(it.svc)saErr("service",{name:it.name});
      var n=saNum(l.qty);if(kind!=="adj"&&n<=0)saErr("qty",{name:it.name});sum[it.id]=(sum[it.id]||0)+n});
    Object.keys(sum).forEach(function(id){var it=itemById(id),n=sum[id];
      if(kind==="out"){if(n>st2[id].q+1e-9)saErr("nostock",{name:it.name,have:st2[id].q});
        if(rem&&(!rem[id]||n>rem[id].left+1e-9))saErr("overquote",{name:it.name,left:rem[id]?rem[id].left:0})}
      if(kind==="adj"&&st2[id].q+n<-1e-9)saErr("nostock",{name:it.name,have:st2[id].q})});
    var date=saStr(p.date,10)||new Date(now).toISOString().slice(0,10),made=[];
    lines.forEach(function(l){var it=itemById(l.itemId);
      var m={id:opId?opId+"_"+made.length:saId("m"),date:date,kind:kind,itemId:it.id,code:it.code,name:it.name,qty:saR2(saNum(l.qty)),cost:0,doc:saStr(p.doc,80),party:saStr(p.party,200),
        quoteId:qq?qq.id:"",quoteNo:qq?qq.no:"",note:saStr(p.note,500),by:u.name,at:now};
      if(kind==="in"&&SA_CAN.seeCost(role)&&saNum(l.cost)>0){m.cost=saR2(saNum(l.cost));it.cost=m.cost;it.updatedAt=now;it.by=u.name;ch.items.push(it)}
      else if(kind!=="in")m.cost=saNum(it.cost);
      db.moves.push(m);ch.moves.push(m);made.push(m)});
    if(qq&&kind==="out"){var r2=saRemaining(db,qq),left=0;Object.keys(r2).forEach(function(id){left+=r2[id].left});
      if(left<=1e-9){qq.status="done";qq.updatedAt=now;qq.by=u.name;ch.quotes.push(qq)}}
    return {res:{moves:made.map(function(m){return saPubMove(m,role)}),stock:saStock(db)},ch:ch}}

  case "setCost":{need(SA_CAN.seeCost(role));var mv=null;db.moves.forEach(function(m){if(m.id===p.id&&!m.del)mv=m});if(!mv)saErr("notfound");
    if(mv.kind!=="in")saErr("kind");mv.cost=Math.max(0,saR2(saNum(p.cost)));ch.moves.push(mv);
    var latest=db.moves.filter(function(m){return !m.del&&m.kind==="in"&&m.itemId===mv.itemId&&saNum(m.cost)>0}).sort(function(a,b){return String(b.date).localeCompare(String(a.date))||(b.at-a.at)})[0];
    var itc=itemById(mv.itemId);if(itc&&latest&&latest.id===mv.id){itc.cost=mv.cost;itc.updatedAt=now;itc.by=u.name;ch.items.push(itc)}
    return {res:{move:mv},ch:ch}}

  case "delMove":{need(SA_CAN.admin(role));var dm=null;db.moves.forEach(function(m){if(m.id===p.id)dm=m});if(!dm)saErr("notfound");
    var st3=saStock(db);if(dm.kind!=="out"&&st3[dm.itemId]&&st3[dm.itemId].q-saNum(dm.qty)<-1e-9)saErr("nostock",{name:dm.name,have:st3[dm.itemId].q});
    dm.del=true;ch.moves.push(dm);
    if(dm.kind==="out"&&dm.quoteId){var dq2=quoteById(dm.quoteId);if(dq2&&dq2.status==="done"){dq2.status="accepted";dq2.updatedAt=now;dq2.by=u.name;ch.quotes.push(dq2)}}
    return {res:{stock:saStock(db)},ch:ch}}

  case "settings":{need(SA_CAN.admin(role));var s=p.settings||{};ch.settings={};
    SA_SETTING_KEYS.forEach(function(k){if(s[k]!==undefined){db.settings[k]=["valid","vat","maxDisc"].indexOf(k)>=0?saNum(s[k]):saStr(s[k],2000);ch.settings[k]=db.settings[k]}});
    return {res:{settings:saSettings(db)},ch:ch}}
  }
  saErr("action")}

/* demo-mode helper: merge changed rows into an in-memory db */
function saApply(db,ch){["items","moves","quotes"].forEach(function(k){(ch[k]||[]).forEach(function(r){var f=false;for(var i=0;i<db[k].length;i++)if(db[k][i].id===r.id){db[k][i]=r;f=true}if(!f)db[k].push(r)})});
  if(ch.settings)for(var k in ch.settings)db.settings[k]=ch.settings[k];return db}

</script>

/* ================= helpers ================= */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const pad2=n=>String(n).padStart(2,"0");
const today=()=>{const d=new Date();return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())};
function fmtDate(iso){const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso||"");return m?m[3]+"."+m[2]+"."+m[1]:""}
function addDays(iso,n){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||"");if(!m)return "";const d=new Date(+m[1],+m[2]-1,+m[3]+Math.round(saNum(n)));return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())}
function money(n){n=saR2(saNum(n));const neg=n<0,[i,f]=Math.abs(n).toFixed(2).split(".");return (neg?"−":"")+i.replace(/\B(?=(\d{3})+(?!\d))/g," ")+","+f}
const AZN=n=>money(n)+" ₼";
function qf(n){n=saR2(saNum(n));return String(n).replace(".",",")}
function getP(o,p){return p.split(".").reduce((a,k)=>a==null?a:a[k],o)}
function setP(o,p,v){const ks=p.split(".");let a=o;for(let i=0;i<ks.length-1;i++){if(a[ks[i]]==null)a[ks[i]]={};a=a[ks[i]]}a[ks[ks.length-1]]=v}
let toastT;function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3600)}
const norm=s=>String(s||"").toLocaleLowerCase("az").replace(/[ıi̇]/g,"i").replace(/ə/g,"e").replace(/ö/g,"o").replace(/ü/g,"u").replace(/ş/g,"s").replace(/ç/g,"c").replace(/ğ/g,"g");

/* amount in words (Azerbaijani) */
const W1=["","bir","iki","üç","dörd","beş","altı","yeddi","səkkiz","doqquz"],W10=["","on","iyirmi","otuz","qırx","əlli","altmış","yetmiş","səksən","doxsan"];
function w999(n){const h=Math.floor(n/100),t=Math.floor(n%100/10),o=n%10,out=[];if(h)out.push((h>1?W1[h]+" ":"")+"yüz");if(t)out.push(W10[t]);if(o)out.push(W1[o]);return out.join(" ")}
function inWords(n){n=Math.floor(n);if(!n)return "sıfır";const p=[],b=Math.floor(n/1e9),m=Math.floor(n%1e9/1e6),k=Math.floor(n%1e6/1e3),r=n%1e3;
  if(b)p.push(w999(b)+" milyard");if(m)p.push(w999(m)+" milyon");if(k)p.push((k===1?"":w999(k)+" ")+"min");if(r)p.push(w999(r));return p.join(" ")}
function amountWords(x){x=saR2(saNum(x));const m=Math.floor(x),q=Math.round((x-m)*100);const s=inWords(m)+" manat "+pad2(q)+" qəpik";return s.charAt(0).toLocaleUpperCase("az")+s.slice(1)}

const state={me:{name:"",url:"",key:"",role:"",pos:"",tel:"",demoRole:"isci"},settings:{...SA_DEFAULTS},items:[],stock:{},remote:{},local:{},pending:new Set(),
  view:"quotes",cur:null,etab:"cl",q:"",qf:"all",cq:"",cc:"",sf:"all",mf:"all",mq:"",moves:null,online:null,syncing:false,syncErr:"",dirty:false,demoReady:false,outbox:[],remaining:{},lastSync:0};
const hasServer=()=>IS_GAS||!!(state.me.url&&state.me.key);
const isDemo=()=>!hasServer();
const role=()=>isDemo()?(state.me.demoRole||"isci"):(state.me.role||"isci");
const can=k=>SA_CAN[k](role());
const itemsById=()=>{const m={};state.items.forEach(i=>m[i.id]=i);return m};
function loadLocal(){
  Object.assign(state.me,LS.get("sa.me")||{});
  if(!state.me.url)state.me.url=CFG.serverUrl||"";if(!state.me.key)state.me.key=CFG.apiKey||"";
  (LS.get(KQ())||[]).forEach(q=>{if(q&&q.id)state.local[q.id]=q});
  (LS.get(KP())||[]).forEach(id=>state.pending.add(id));
  const c=LS.get(isDemo()?"sa.cache.demo":"sa.cache")||{};
  state.items=c.items||[];state.stock=c.stock||{};(c.quotes||[]).forEach(s=>state.remote[s.id]=s);state.settings={...SA_DEFAULTS,...(c.settings||{})};
  state.moves=c.moves||null;state.remaining=c.remaining||{};state.lastSync=c.lastSync||0;state.outbox=LS.get(KO())||[]}
const KQ=()=>isDemo()?"sa.demo.quotes":"sa.quotes",KP=()=>isDemo()?"sa.demo.pending":"sa.pending",KO=()=>isDemo()?"sa.demo.outbox":"sa.outbox";
function resetMode(){state.local={};state.remote={};state.pending=new Set();state.items=[];state.stock={};state.moves=null;state.remaining={};state.outbox=[];loadLocal()}
const saveOutbox=()=>{if(!LS.set(KO(),state.outbox))toast("Cihazın yaddaşı dolub")};

/* ================= server API ================= */
const ERR={forbidden:"Bu əməliyyat sizin rolunuz üçün icazəli deyil",locked:"Təhvil verilmiş təklif dəyişdirilə bilməz",code:"Malın kodunu yazın",name:"Malın adını yazın",
  dupcode:"Bu kodla mal artıq var",nostock:d=>`Anbarda kifayət qədər yoxdur: ${d.name} (qalıq ${qf(d.have)})`,overquote:d=>`${d.name}: təklif üzrə verilməli qalan ${qf(d.left)}`,
  notaccepted:"Təklif hələ qəbul edilməyib",note:"Düzəliş üçün səbəbi yazın",empty:"Ən azı bir sətir doldurun",service:d=>`${d.name} xidmətdir — anbarda saxlanmır`,
  qty:d=>`${d.name}: say müsbət olmalıdır`,auth:"API açarı yanlışdır və ya istifadəçi deaktivdir",notfound:"Tapılmadı",conflict:"Bu sənəd başqa cihazda dəyişdirilib",kind:"Yanlış əməliyyat növü"};
function errMsg(e){if(!e||!e.server)return "İnternet yoxdur və ya server cavab vermir";const c=(e.data&&e.data.error)||e.message,f=ERR[c];return typeof f==="function"?f(e.data||{}):f||("Server xətası: "+c)}
async function api(action,payload={}){
  if(isDemo()){const db=demoLoad();try{const r=saHandle(db,{name:state.me.name||"Demo",role:role()},action,clone(payload));saApply(db,r.ch);demoSave(db);await new Promise(r=>setTimeout(r,60));return clone({ok:true,...r.res})}
    catch(e){const er=new Error(e.code||e.message);er.server=true;er.data={error:e.code||e.message,...(e.extra||{})};throw er}}
  const body={key:state.me.key,action,worker:state.me.name,...payload};
  if(IS_GAS)return new Promise((res,rej)=>google.script.run
    .withSuccessHandler(r=>{if(r&&r.ok)res(r);else{const e=new Error(r&&r.error||"server");e.server=true;e.data=r||{};rej(e)}})
    .withFailureHandler(e=>rej(e)).api(body));
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),60000);
  try{const res=await fetch(state.me.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body),signal:ctl.signal,redirect:"follow"});
    let j;try{j=await res.json()}catch(e){const er=new Error("bad_response");throw er}
    if(!j.ok){const e=new Error(j.error||"server");e.server=true;e.data=j;throw e}return j}
  finally{clearTimeout(t)}}

/* ================= sync =================
   Everything a user does is saved on this device first (works without internet).
   Changes wait in a queue and go to the server automatically: every few minutes,
   when the internet comes back, when the app is closed/hidden, or on tapping the sync badge. */
let syncTimer=null,pendingRemote=false;
const syncEvery=()=>Math.max(1,saNum(state.me.syncMin)||2)*60000;
function scheduleSync(ms=2000){clearTimeout(syncTimer);syncTimer=setTimeout(sync,ms)}
const editorBusy=()=>{const a=document.activeElement;return a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)};
function applyServerQuote(q){q.baseAt=q.updatedAt;
  if(state.cur&&state.cur.id===q.id){if(state.dirty)return;state.local[q.id]=q;state.cur=q;if(editorBusy()){pendingRemote=true;return}refreshEditor()}
  else state.local[q.id]=q}
document.addEventListener("focusout",()=>{if(pendingRemote)setTimeout(()=>{if(!editorBusy()&&pendingRemote){pendingRemote=false;refreshEditor()}},250)});
function refreshEditor(){if(state.view!=="quote")return;const y=window.scrollY;renderQuote();window.scrollTo(0,y)}
function applyBoot(B){state.items=B.items||[];state.stock=B.stock||{};state.remote={};(B.quotes||[]).forEach(s=>state.remote[s.id]=s);
  if(B.moves)state.moves=B.moves;if(B.remaining)state.remaining=B.remaining;
  state.settings={...SA_DEFAULTS,...(B.settings||{})};if(!isDemo()&&B.role&&B.role!==state.me.role){state.me.role=B.role;saveMe()}saveCache()}
/* queue a change: it is already applied on screen; the server receives it on the next sync */
function queueOp(action,payload,msg){state.outbox.push({id:saId("o"),action,payload,at:Date.now()});saveOutbox();if(msg)toast(msg+(state.online===false?" (oflayn — sonra göndəriləcək)":""));badge();
  if(isDemo())scheduleSync(800);else if(!syncTimer||state.online)scheduleSync(Math.min(syncEvery(),60000))}
const pendingCount=()=>state.pending.size+state.outbox.length;
async function sync(){
  clearTimeout(syncTimer);syncTimer=null;if(state.syncing){scheduleSync(3000);return}
  if(typeof navigator!=="undefined"&&navigator.onLine===false&&!isDemo()){state.online=false;badge();scheduleSync(syncEvery());return}
  state.syncing=true;badge();const failed=[];
  try{
    /* 1) quotes */
    for(const id of [...state.pending]){const q=state.local[id];if(!q){state.pending.delete(id);continue}
      if(state.cur&&state.cur.id===id&&state.dirty)continue;
      if(!q.no&&!(q.cl&&q.cl.name)&&!(q.lines||[]).length)continue;
      try{const r=await api("saveQuote",{quote:q,baseAt:q.baseAt||0});state.pending.delete(id);applyServerQuote(r.quote)}
      catch(e){if(!e.server)throw e;state.pending.delete(id);
        if(e.data&&e.data.error==="conflict"&&e.data.quote){applyServerQuote(e.data.quote);toast("Bu təklif başqa cihazda dəyişdirilib — yeni versiya yükləndi")}
        else{failed.push("Təklif: "+errMsg(e));try{const g=await api("getQuote",{id});applyServerQuote(g.quote)}catch(_){}}}}
    saveLocal();
    /* 2) queued catalog / stock / settings changes, in the order they were made */
    while(state.outbox.length){const op=state.outbox[0];
      try{await api(op.action,op.payload)}
      catch(e){if(!e.server)throw e;const c=e.data&&e.data.error;if(!(c==="notfound"&&/^del/.test(op.action)))failed.push(errMsg(e))}
      state.outbox.shift();saveOutbox()}
    /* 3) fresh data from the server */
    applyBoot(await api("boot",{full:1}));
    /* 4) keep recent quotes on the device so they open without internet */
    const stale=Object.values(state.remote).filter(s=>!state.pending.has(s.id)&&(!state.local[s.id]||(state.local[s.id].updatedAt||0)<(s.updatedAt||0)))
      .sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)).slice(0,40).map(s=>s.id);
    if(stale.length){const g=await api("getQuotes",{ids:stale});(g.quotes||[]).forEach(q=>{if(!(state.cur&&state.cur.id===q.id&&state.dirty))applyServerQuote(q)})}
    for(const id in state.local)if(!state.remote[id]&&!state.pending.has(id)&&state.local[id].no)delete state.local[id];
    saveLocal();state.online=true;state.syncErr="";state.lastSync=Date.now();saveCache();
  }catch(e){state.online=false;state.syncErr=errMsg(e)}
  finally{state.syncing=false;badge();scheduleSync(state.online?syncEvery():Math.min(syncEvery(),60000));
    if(failed.length){state.syncErr=failed.join("; ");toast("Serverdə qəbul olunmadı: "+failed[0]+(failed.length>1?" (+"+(failed.length-1)+")":""))}
    if(!editorBusy()&&["quotes","catalog","stock","moves"].includes(state.view))render()}}
window.addEventListener("online",()=>{state.online=null;scheduleSync(800)});
window.addEventListener("offline",()=>{state.online=false;badge()});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"){flush();if(pendingCount())sync()}
  else if(Date.now()-(state.lastSync||0)>syncEvery())scheduleSync(800)});
function badge(){const el=$("#syncState");if(!el)return;const n=pendingCount();let t="",c="";
  if(isDemo()){t="DEMO";c="warn"}else if(state.syncing)t="sinxronlaşır…";else if(state.online===false){t=(n?n+" gözləyir · ":"")+"oflayn";c="warn"}
  else if(n){t=n+" gözləyir ⟳";c="warn"}else if(state.online){t="sinxron ✓";c="ok"}else t="⟳";
  el.textContent=t;el.className="sync "+c;el.style.cursor="pointer";
  el.title=(state.syncErr?state.syncErr+"\n":"")+(state.lastSync?"Son sinxron: "+new Date(state.lastSync).toLocaleTimeString("az"):"")+"\nİndi sinxronlaşdırmaq üçün basın"}
document.addEventListener("click",e=>{if(e.target&&e.target.id==="syncState"&&!state.syncing){flush();sync()}});

let saveTimer=null;
function markDirty(){if(!state.cur)return;state.dirty=true;$("#saveState").textContent="dəyişiklik…";clearTimeout(saveTimer);saveTimer=setTimeout(flush,900)}
async function flush(){clearTimeout(saveTimer);if(!state.cur||!state.dirty)return;state.dirty=false;
  const q=state.cur;q.localAt=Date.now();state.local[q.id]=q;state.pending.add(q.id);saveLocal();$("#saveState").textContent="saxlanıldı ✓";badge();
  if(isDemo())scheduleSync(1500)}

  t.querySelectorAll(".tab").forEach(b=>b.onclick=async()=>{await flush();state.etab=b.dataset.t;renderQuote();window.scrollTo(0,0)})}
function go(v,arg){state.view=v;state.arg=arg;window.scrollTo(0,0);render()}

  if(v==="quotes")return renderQuotes();if(v==="catalog")return renderCatalog();if(v==="stock")return renderStock();if(v==="moves")return renderMoves();
  if(v==="item")return renderItem(state.arg);if(v==="move")return renderMoveForm(state.arg);if(v==="settings")return renderSettings();if(v==="quote")return renderQuote()}
const lowCount=()=>state.items.filter(i=>!i.svc&&i.active!==false&&saNum(i.min)>0&&stk(i.id).a<saNum(i.min)).length;
const stk=id=>state.stock[id]||{q:0,r:0,a:0};
function stockChip(it,need){if(!it||it.svc)return "";const s=stk(it.id);const c=s.a<=0?"bad":(need&&s.a<need)||(saNum(it.min)&&s.a<saNum(it.min))?"warn":"ok";

/* ================= quotes list ================= */
function listQuotes(){const m={...state.remote};for(const id in state.local){const q=state.local[id];
    if(state.pending.has(id)||!m[id]||(q.updatedAt||0)>(m[id].updatedAt||0)||(q.localAt||0)>(m[id].updatedAt||0)){if(q.del)continue;if(!q.no&&!(q.cl&&q.cl.name)&&!(q.lines||[]).length&&!(state.cur&&state.cur.id===id))continue;m[id]={...saSummary(q),pending:state.pending.has(id)}}}
  return Object.values(m).sort((a,b)=>String(b.date).localeCompare(String(a.date))||(b.updatedAt||0)-(a.updatedAt||0))}
function renderQuotes(){mainTabs("quotes");const all=listQuotes(),Q=norm(state.q),F=state.qf;
  const cnt=k=>all.filter(s=>s.status===k).length;
  const list=all.filter(s=>(F==="all"||s.status===F||(F==="mine"&&s.author===state.me.name))&&(!Q||norm([s.no,s.client,s.subj,s.author,s.cl&&s.cl.person].join(" ")).includes(Q)));
  const accTot=all.filter(s=>s.status==="accepted"||s.status==="done").reduce((a,s)=>a+saNum(s.total),0);
  $("#main").innerHTML=`<h2 class="sec">Qiymət təklifləri</h2><p class="hint">${can("quote")?"Kataloqdan mal və xidmət seçin — qiymət, ƏDV və yekun avtomatik hesablanır, PDF şirkət blankında hazırlanır.":"Qəbul edilmiş təkliflər üzrə malları “Anbar” bölməsindən məxaric edin."}</p>
  <div class="toolbar"><input type="search" id="q" placeholder="Axtar: nömrə, müştəri, mövzu…" value="${esc(state.q)}">${can("quote")?`<button class="btn pri" id="bNew">+ Yeni təklif</button>`:""}</div>
  <div class="seg filters" style="margin-bottom:12px">${[["all","Hamısı",all.length],["mine","Mənim",all.filter(s=>s.author===state.me.name).length],["draft","Qaralama",cnt("draft")],["sent","Göndərildi",cnt("sent")],["accepted","Qəbul edildi",cnt("accepted")],["done","Təhvil verildi",cnt("done")],["rejected","İmtina",cnt("rejected")]]

  try{const src=paper.cloneNode(true);src.removeAttribute("id");src.classList.add("pdfmode");src.style.transform="none";host.appendChild(src);
    const kids=[...src.children].filter(c=>!c.classList.contains("ph"));
    const tops=kids.map(c=>c.getBoundingClientRect().top),endY=src.getBoundingClientRect().bottom;
    const outerH=el=>{const cs=getComputedStyle(el);return el.getBoundingClientRect().height+(parseFloat(cs.marginTop)||0)+(parseFloat(cs.marginBottom)||0)};

    const split=(el,room)=>{const isT=el.tagName==="TABLE",isL=el.tagName==="UL"||el.tagName==="OL";if(!isT&&!isL)return null;
      const parts=isT?[...el.rows]:[...el.children],hd=isT&&parts[0]&&parts[0].querySelector("th")?parts.shift():null,hh=hd?hd.getBoundingClientRect().height:0,pad=isT?4:10;
      let n=0,gh=hh;while(n<parts.length&&gh+outerH(parts[n])<=room-pad){gh+=outerH(parts[n]);n++}
      if(n<(isT?3:2)||n>=parts.length)return null;
      const mk=(list,first)=>{const t=el.cloneNode(false);if(!first)t.style.marginTop="0";if(hd)t.appendChild(first?hd:hd.cloneNode(true));list.forEach(x=>t.appendChild(x));return t};
      const restH=parts.slice(n).reduce((x,p)=>x+outerH(p),hh)+pad;
      return [{el:mk(parts.slice(0,n),true),h:gh+pad},{el:mk(parts.slice(n),false),h:restH}]};
    const queue=[];kids.forEach((c,i)=>queue.push(c.classList.contains("pb")?{pb:1}:{el:c,h:(i+1<kids.length?tops[i+1]:endY)-tops[i]}));

    while(queue.length){const it=queue.shift();if(it.pb){close();continue}
      const room=FILL-used;

        cur.push(it.el);used+=it.h;continue}
      if(it.h<=FILL){close();queue.unshift(it);continue}
      if(!/^(TABLE|UL|OL)$/.test(it.el.tagName)&&it.el.children.length>1){queue.unshift(...[...it.el.children].map(ch=>({el:ch,h:outerH(ch)})));continue}
      const sp=split(it.el,room);if(sp){cur.push(sp[0].el);used+=sp[0].h;close();queue.unshift(sp[1]);continue}
      if(cur.length){close();queue.unshift(it);continue}
      cur.push(it.el);close()}
    close();
    const divs=pages.map(list=>{const d=document.createElement("div");d.className="paper pdfmode";d.setAttribute("lang",paper.getAttribute("lang")||"az");d.style.width=PW+"px";list.forEach(c=>d.appendChild(c));return d});
    host.innerHTML="";let pdf=null;
    for(const d of divs){host.appendChild(d);const w=html2pdf().set(OPT).from(d);const cv=await w.toCanvas().get("canvas");
      if(!pdf){pdf=await w.toPdf().get("pdf");for(let j=pdf.internal.getNumberOfPages();j>=1;j--)pdf.deletePage(j)}pdf.addPage("a4","portrait");
      host.removeChild(d);

      const parts=cv.height<=pp*1.06?[[0,cv.height]]:Array.from({length:Math.ceil(cv.height/pp)},(_,k)=>[k*pp,Math.min(pp,cv.height-k*pp)]);
      parts.forEach(([y,hh],k)=>{let c2=cv;if(parts.length>1){c2=document.createElement("canvas");c2.width=cv.width;c2.height=hh;const x=c2.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c2.width,hh);x.drawImage(cv,0,y,cv.width,hh,0,0,cv.width,hh)}

    return pdf}
  finally{host.remove()}}

/* ================= local (offline-first) changes: applied on screen now, sent to the server later ================= */
function recalc(id){const s=state.stock[id]||(state.stock[id]={q:0,r:0,a:0});s.q=saR2(s.q);s.r=saR2(Math.max(0,s.r));s.a=saR2(s.q-s.r);return s}
function localSaveItem(o,ex){const code=String(o.code||"").trim(),name=String(o.name||"").trim();if(!code)return ERR.code;if(!name)return ERR.name;
  if(state.items.some(x=>x.code.toLowerCase()===code.toLowerCase()&&(!ex||x.id!==ex.id)))return ERR.dupcode;
  const id=ex?ex.id:saId("i"),now=Date.now(),it={...(ex||{cost:0,price:0,created:now}),...o,id,code,name,updatedAt:now,by:state.me.name};
  ["min","cost","price"].forEach(k=>it[k]=Math.max(0,saR2(saNum(it[k]))));it.svc=!!o.svc;it.active=o.active!==false;
  if(!can("setPrice")){it.price=ex?saNum(ex.price):0;if(ex&&"cost" in ex)it.cost=ex.cost;else delete it.cost}
  const i=state.items.findIndex(x=>x.id===id);if(i>=0)state.items[i]=it;else state.items.push(it);if(!state.stock[id])state.stock[id]={q:0,r:0,a:0};
  saveCache();queueOp("saveItem",{item:{...o,id,code,name}},"Yadda saxlanıldı");return ""}
function localAddMoves(p,label){const I=itemsById(),kind=p.kind,lines=p.lines.filter(l=>l.itemId&&saNum(l.qty)!==0);
  if(!lines.length)return ERR.empty;if(kind==="adj"&&!String(p.note||"").trim())return ERR.note;
  const sum={};for(const l of lines){const it=I[l.itemId];if(!it)return ERR.notfound;if(it.svc)return ERR.service({name:it.name});
    if(kind!=="adj"&&saNum(l.qty)<=0)return ERR.qty({name:it.name});sum[it.id]=(sum[it.id]||0)+saNum(l.qty)}
  const rem=p.quoteId?state.remaining[p.quoteId]:null;
  for(const id in sum){const n=sum[id],s=stk(id),it=I[id];
    if(kind==="out"&&n>s.q+1e-9)return ERR.nostock({name:it.name,have:s.q});
    if(kind==="out"&&rem&&(!rem[id]||n>rem[id].left+1e-9))return ERR.overquote({name:it.name,left:rem[id]?rem[id].left:0});
    if(kind==="adj"&&s.q+n<-1e-9)return ERR.nostock({name:it.name,have:s.q})}
  const opId=saId("o"),now=Date.now(),date=p.date||today(),qs=p.quoteId?state.remote[p.quoteId]:null,made=[];
  lines.forEach((l,i)=>{const it=I[l.itemId],n=saR2(saNum(l.qty)),s=recalc(it.id);
    s.q+=kind==="out"?-n:n;if(kind==="out"&&rem&&rem[it.id]){rem[it.id].left=saR2(rem[it.id].left-n);rem[it.id].issued=saR2(rem[it.id].issued+n);s.r-=n}recalc(it.id);
    let cost=kind!=="in"?saNum(it.cost):0;if(kind==="in"&&can("seeCost")&&saNum(l.cost)>0){cost=saR2(saNum(l.cost));it.cost=cost}
    made.push({id:opId+"_"+i,date,kind,itemId:it.id,code:it.code,name:it.name,qty:n,cost,doc:p.doc||"",party:p.party||"",quoteId:p.quoteId||"",quoteNo:qs?qs.no:"",note:p.note||"",by:state.me.name,at:now,pending:true})});
  if(rem&&qs&&Object.values(rem).every(x=>x.left<=1e-9)){qs.status="done";delete state.remaining[p.quoteId]}
  if(can("seeMoves"))state.moves=[...made,...(state.moves||[])];
  saveCache();queueOp("addMoves",{...p,opId},label+" qeydə alındı");return ""}
function localSetCost(id,v){const m=(state.moves||[]).find(x=>x.id===id);if(!m)return;m.cost=saR2(v);
  const last=(state.moves||[]).filter(x=>x.itemId===m.itemId&&x.kind==="in"&&saNum(x.cost)>0)[0],it=state.items.find(x=>x.id===m.itemId);if(it&&last&&last.id===id)it.cost=m.cost;
  saveCache();queueOp("setCost",{id,cost:v},"Gəliş qiyməti yazıldı")}
function localDelMove(id){const m=(state.moves||[]).find(x=>x.id===id);if(!m)return ERR.notfound;const s=stk(m.itemId);
  if(m.kind!=="out"&&s.q-saNum(m.qty)<-1e-9)return ERR.nostock({name:m.name,have:s.q});
  const st=recalc(m.itemId);st.q+=m.kind==="out"?saNum(m.qty):-saNum(m.qty);recalc(m.itemId);
  state.moves=state.moves.filter(x=>x.id!==id);saveCache();queueOp("delMove",{id},"Hərəkət silindi");return ""}

/* ================= mədaxil / məxaric / düzəliş form ================= */
let MF=null;
async function renderMoveForm(arg){arg=arg||{};const kind=arg.kind||"in";subPage("stock");header();
  if(!can("moveStock")){$("#main").innerHTML='<div class="locked">Anbar əməliyyatları yalnız anbardar və rəhbər üçündür.</div>';return}
  if(!MF||MF.kind!==kind||MF.quoteId!==(arg.quoteId||"")||MF.seed!==arg){MF={kind,seed:arg,quoteId:arg.quoteId||"",date:today(),doc:"",party:"",note:"",lines:[],rem:null};
    if(arg.itemId)MF.lines.push({itemId:arg.itemId,qty:"",cost:""});
    if(kind==="out"&&arg.quoteId)await pickQuote(arg.quoteId)}
  const T={in:["Mədaxil","Mal anbara daxil olur (təchizatçıdan alış, qaytarma)","Təchizatçı"],out:["Məxaric","Mal anbardan çıxır (müştəriyə təhvil, servis üçün istifadə)","Alıcı / təyinat"],adj:["Düzəliş (inventar)","Sayım nəticəsində fərq: + artırır, − azaldır. Səbəb mütləqdir.","—"]}[kind];
  const acc=listQuotes().filter(s=>s.status==="accepted"),I=itemsById(),sc=can("seeCost");
  let h=`<h2 class="sec">${T[0]}</h2><p class="hint">${T[1]}</p><div class="cols2"><div class="col"><div class="card"><h3>Sənəd</h3>
    <div class="grid2"><label class="f"><span>Tarix</span><input type="date" data-m="date" value="${esc(MF.date)}"></label><label class="f"><span>${kind==="in"?"Qaimə / faktura №":"Sənəd №"}</span><input data-m="doc" value="${esc(MF.doc)}"></label></div>
    ${kind==="out"?`<label class="f"><span>Qiymət təklifi (rezervdən çıxılır)</span><select id="mQuote"><option value="">— Təkliflə bağlı deyil —</option>${acc.map(s=>`<option value="${s.id}" ${s.id===MF.quoteId?"selected":""}>${esc(s.no)} · ${esc(s.client)}</option>`).join("")}</select></label>`:""}
    ${kind!=="adj"?`<label class="f"><span>${T[2]}</span><input data-m="party" value="${esc(MF.party)}"></label>`:""}
    <label class="f"><span>${kind==="adj"?"Səbəb (mütləq)":"Qeyd"}</span><input data-m="note" value="${esc(MF.note)}"></label></div></div>
    <div class="col"><div class="card"><h3>Mallar · ${MF.lines.length}</h3>${MF.quoteId?"":`<input type="search" id="addq" placeholder="Mal axtar: ad, kod…" autocomplete="off"><div class="results" id="addRes"></div>`}
    <div style="display:grid;gap:10px">${MF.lines.map((l,i)=>{const it=I[l.itemId]||{name:"?"},s=stk(l.itemId),rm=MF.rem&&MF.rem[l.itemId];
      return `<div class="lcard" data-i="${i}"><div class="lhead"><span class="ix">${i+1}</span><span class="cd"><b style="color:var(--ink);font-family:var(--f-body)">${esc(it.name)}</b> · ${esc(it.code||"")}</span><button class="btn sm ghost icon danger" data-rm>✕</button></div>
        <div class="note">Qalıq ${qf(s.q)} · rezerv ${qf(s.r)} · mövcud ${qf(s.a)}${rm?` · təklif üzrə: ${qf(rm.need)}, verilib ${qf(rm.issued)}, qalan <b>${qf(rm.left)}</b>`:""}</div>
        <div class="grid2"><label class="f"><span>Say ${kind==="adj"?"(+/−)":""}, ${esc(it.unit||"")}</span><input class="num" inputmode="decimal" data-l="qty" value="${esc(l.qty)}"></label>
        ${kind==="in"&&sc?`<label class="f"><span>Gəliş qiyməti, ₼</span><input class="num" inputmode="decimal" data-l="cost" value="${esc(l.cost)}" placeholder="${saNum(it.cost)?qf(it.cost):""}"></label>`:kind==="in"?'<p class="note" style="align-self:end;margin:0">Gəliş qiymətini mühasib yazacaq.</p>':""}</div></div>`}).join("")||'<p class="note" style="margin:0">Mal seçin.</p>'}</div></div>
    <div class="actions"><button class="btn pri" id="mGo">${T[0]} et</button><button class="btn" id="mNo">Ləğv et</button></div></div></div>`;
  $("#main").innerHTML=h;
  $$("[data-m]").forEach(el=>el.oninput=()=>MF[el.dataset.m]=el.value);
  const sq=$("#mQuote");if(sq)sq.onchange=async()=>{if(sq.value)await pickQuote(sq.value);else{MF.quoteId="";MF.rem=null;MF.lines=[]}MF.seed={kind,quoteId:MF.quoteId};state.arg=MF.seed;renderMoveForm(MF.seed)};
  $$("#main .lcard").forEach(c=>{const l=MF.lines[+c.dataset.i];c.querySelectorAll("[data-l]").forEach(el=>el.oninput=()=>l[el.dataset.l]=el.value);c.querySelector("[data-rm]").onclick=()=>{MF.lines.splice(+c.dataset.i,1);renderMoveForm(MF.seed)}});
  const aq=$("#addq");if(aq)aq.oninput=()=>{const Q=norm(aq.value).trim(),box=$("#addRes");if(!Q){box.innerHTML="";return}
    const hits=state.items.filter(i=>!i.svc&&Q.split(/\s+/).every(w=>norm([i.code,i.name,i.brand,i.model].join(" ")).includes(w))).slice(0,8);
    box.innerHTML=hits.map(i=>`<button class="res" data-id="${i.id}"><span class="n">${esc(i.name)}</span><span class="note">qalıq ${qf(stk(i.id).q)}</span><span class="s"><span class="no">${esc(i.code)}</span></span></button>`).join("")||'<p class="note" style="margin:0">Tapılmadı. Yeni malı əvvəlcə kataloqa əlavə edin.</p>';
    box.querySelectorAll(".res").forEach(b=>b.onclick=()=>{if(!MF.lines.some(l=>l.itemId===b.dataset.id))MF.lines.push({itemId:b.dataset.id,qty:"",cost:""});renderMoveForm(MF.seed);const n=$$("#main [data-l=qty]");if(n.length)n[n.length-1].focus()})};
  $("#mNo").onclick=()=>{MF=null;go("stock")};
  $("#mGo").onclick=async()=>{const b=$("#mGo");b.disabled=true;
    const err=localAddMoves({kind,date:MF.date,doc:MF.doc,party:MF.party,note:MF.note,quoteId:MF.quoteId,lines:MF.lines.map(l=>({itemId:l.itemId,qty:saNum(l.qty),cost:saNum(l.cost)}))},T[0]);
    b.disabled=false;if(err){toast(err);return}MF=null;go("stock")}}
async function pickQuote(id){MF.quoteId=id;const rem=state.remaining[id],q=state.remote[id];
  if(!rem||!q){toast("Bu təklif bu cihazda hələ sinxron deyil — internetə qoşulub sinxron nişanına basın");MF.quoteId="";MF.rem=null;return}
  MF.rem=clone(rem);MF.party=q.client||"";MF.note="Təklif "+q.no;
  MF.lines=Object.keys(MF.rem).filter(k=>MF.rem[k].left>0).map(k=>({itemId:k,qty:qf(Math.min(MF.rem[k].left,Math.max(0,stk(k).q))),cost:""}))}

/* ================= settings ================= */
function renderSettings(){state.view="settings";subPage(role()==="anbardar"?"stock":"quotes");header();const S=state.settings,adm=can("admin"),demo=isDemo();
  const sf=(k,l,o={})=>o.ta?`<label class="f"><span>${l}</span><textarea data-s="${k}" rows="${o.rows||2}"${adm?"":" disabled"}>${esc(S[k])}</textarea></label>`:`<label class="f"><span>${l}</span><input data-s="${k}"${o.num?' class="num" inputmode="decimal"':""} value="${esc(S[k])}"${adm?"":" disabled"}></label>`;
  $("#main").innerHTML=`<h2 class="sec">Ayarlar</h2><p class="hint">Rolunuz: <span class="who">${esc(SA_ROLES[role()])}</span>${demo?' <span class="who demo">demo rejimi — məlumatlar yalnız bu cihazdadır</span>':""}</p>
  <div class="cols2"><div class="col"><div class="card"><h3>Mən</h3><label class="f"><span>Ad, soyad</span><input id="meName" value="${esc(state.me.name)}"></label>
    <div class="grid2"><label class="f"><span>Vəzifə (təklifdə)</span><input id="mePos" value="${esc(state.me.pos||"")}" placeholder="Satış mühəndisi"></label><label class="f"><span>Telefon (təklifdə)</span><input id="meTel" type="tel" value="${esc(state.me.tel||"")}"></label></div>
    ${IS_GAS?"":`<label class="f"><span>Server ünvanı</span><input id="meUrl" inputmode="url" value="${esc(state.me.url)}" placeholder="boş qalsa — demo rejimi"></label>`}
    <label class="f"><span>Şəxsi API açarı</span><input id="meKey" autocomplete="off" value="${esc(state.me.key)}"></label>
    ${demo?"":`<div class="grid2"><label class="f"><span>Avtomatik sinxron, hər … dəqiqə</span><input id="meSync" class="num" inputmode="numeric" value="${esc(state.me.syncMin||2)}"></label>
      <div class="f"><span class="note" style="font-weight:600">${pendingCount()} dəyişiklik gözləyir${state.lastSync?" · son: "+new Date(state.lastSync).toLocaleString("az"):""}</span><button class="btn" id="syncNow">İndi sinxronlaşdır</button></div></div>
      <p class="note" style="margin:0">Bütün işlər əvvəlcə bu cihazda saxlanılır və internetsiz də görünür. İnternet olanda dəyişikliklər avtomatik serverə göndərilir.</p>`}
    <div class="actions"><button class="btn pri" id="meSave">Yadda saxla</button><button class="btn" id="mePing">Bağlantını yoxla</button></div><p class="note" id="pingMsg" style="margin:0"></p></div>
    ${demo?`<div class="card"><h3>Demo: rolu dəyiş</h3><p class="note" style="margin:0">Proqramın hər rolda necə göründüyünü yoxlayın. Real işdə rolu açar müəyyən edir.</p>
      <div class="seg">${Object.keys(SA_ROLES).map(k=>`<button data-role="${k}" aria-pressed="${role()===k}">${SA_ROLES[k]}</button>`).join("")}</div>
      <button class="btn sm danger" id="demoReset">Demo məlumatlarını sıfırla</button></div>`:""}
    <div class="card"><h3>Rollar</h3><ul class="concl" style="font-size:13px"><li><b>İşçi</b> — təklif hazırlayır; satış qiymətini və mövcud qalığı görür; endirim maks. ${qf(S.maxDisc)}%.</li>
      <li><b>Anbardar</b> — mədaxil, məxaric, inventar düzəlişi; yeni mal kartı; gəliş qiymətini görmür.</li><li><b>Mühasib</b> — gəliş və satış qiymətləri, mənfəət, Excel idxalı, qiymətsiz mədaxillərə qiymət.</li><li><b>Rəhbər</b> — hamısı + silmə və şirkət ayarları.</li></ul></div></div>
  <div class="col"><div class="card"><h3>Şirkət və təklif blankı ${adm?"":"(yalnız rəhbər dəyişir)"}</h3>${sf("co","Şirkət adı")}${sf("coaddr","Ünvan")}<div class="grid2">${sf("cotel","Telefon")}${sf("coemail","E-poçt")}</div><div class="grid2">${sf("covoen","VÖEN")}${sf("prefix","Təklif nömrəsi prefiksi")}</div>
    ${sf("bank","Bank rekvizitləri (təklifin sonunda)",{ta:1,rows:4})}<div class="grid3">${sf("vat","ƏDV %",{num:1})}${sf("valid","Qüvvədə (gün)",{num:1})}${sf("maxDisc","İşçi üçün maks. endirim %",{num:1})}</div>
    ${sf("pay","Standart ödəniş şərti",{ta:1})}${sf("delivery","Standart çatdırılma",{ta:1})}${sf("warranty","Standart zəmanət",{ta:1})}${sf("note","Standart qeyd",{ta:1})}
    ${adm?`<button class="btn pri" id="sSave">Şirkət ayarlarını saxla</button>`:""}</div></div></div>`;
  $("#meSave").onclick=async()=>{const wasDemo=isDemo();state.me.name=$("#meName").value.trim()||state.me.name;state.me.pos=$("#mePos").value.trim();state.me.tel=$("#meTel").value.trim();if($("#meSync"))state.me.syncMin=Math.max(1,Math.round(saNum($("#meSync").value))||2);
    if($("#meUrl"))state.me.url=$("#meUrl").value.trim();state.me.key=$("#meKey").value.trim();saveMe();if(wasDemo!==isDemo())resetMode();toast("Yadda saxlanıldı");header();sync()};
  const sn=$("#syncNow");if(sn)sn.onclick=async()=>{sn.disabled=true;sn.textContent="Sinxronlaşır…";await flush();await sync();toast(state.online?"Sinxronlaşdırıldı ✓":"Serverə qoşulmaq olmadı — sonra avtomatik təkrarlanacaq");renderSettings()};
  $("#mePing").onclick=async()=>{const m=$("#pingMsg");if(isDemo()){m.textContent="Server yazılmayıb — demo rejimi.";return}m.textContent="Yoxlanılır…";
    try{const p=await api("ping");state.me.role=p.role;saveMe();m.textContent="Bağlantı var ✓ Rol: "+SA_ROLES[p.role];header()}catch(e){m.textContent=errMsg(e)}};
  $$("[data-role]").forEach(b=>b.onclick=()=>{state.me.demoRole=b.dataset.role;saveMe();state.moves=null;renderSettings();sync().then(()=>toast("Rol: "+SA_ROLES[role()]))});
  const dr=$("#demoReset");if(dr)dr.onclick=()=>{if(dr.dataset.sure!=="1"){dr.dataset.sure="1";dr.textContent="Təsdiq: sıfırla";return}DEMO_MEM=null;LS.set("sa.demo",null);resetMode();toast("Demo sıfırlandı");sync().then(renderSettings)};
  const ss=$("#sSave");if(ss)ss.onclick=async()=>{const o={};$$("[data-s]").forEach(el=>o[el.dataset.s]=el.value);["valid","vat","maxDisc"].forEach(k=>o[k]=saNum(o[k]));state.settings={...state.settings,...o};saveCache();queueOp("settings",{settings:o},"Şirkət ayarları saxlanıldı")}}

/* ================= theme & boot ================= */
const THEMES=[["auto","◐ Avto"],["light","☀ İşıqlı"],["dark","☾ Qaranlıq"]];
function applyTheme(m){if(m==="light"||m==="dark")document.documentElement.setAttribute("data-theme",m);else document.documentElement.removeAttribute("data-theme");
  const b=$("#hTheme");if(b){const T=THEMES.find(x=>x[0]===m)||THEMES[0];b.innerHTML=T[1].slice(0,1)+'<span class="tl"> '+T[1].slice(2)+"</span>"}
  const dark=m==="dark"||(m!=="light"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);const mc=document.querySelector('meta[name="theme-color"]');if(mc)mc.content=dark?"#0F1513":"#EDF1EF"}
applyTheme(LS.get("sa_theme")||"auto");
$("#hTheme").onclick=()=>{const cur=LS.get("sa_theme")||"auto",i=THEMES.findIndex(x=>x[0]===cur),nx=THEMES[(i+1)%THEMES.length][0];LS.set("sa_theme",nx);applyTheme(nx)};
$("#hSettings").onclick=async()=>{await flush();renderSettings()};
if(IS_APP){try{const AP=(Capacitor.Plugins&&Capacitor.Plugins.App)||Capacitor.registerPlugin("App");
  AP.addListener("backButton",async()=>{if(["quote","item","move","settings"].includes(state.view)){await flush();state.cur=null;go(role()==="anbardar"?"stock":"quotes")}else AP.exitApp()})}catch(e){}}
/* iPhone / browser install: offline cache through a service worker (not inside Google Apps Script or the APK) */
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")&&!IS_GAS&&!IS_APP&&!/script\.google|googleusercontent/.test(location.host)){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
loadLocal();
if(!state.me.name)renderWelcome();else startApp();

</script>
</body>
