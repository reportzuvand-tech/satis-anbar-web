<script>/*ZSUPD-BOOT*/window.ZS_BUILD=2026111105;window.ZS_APP="sa";(function(){
/* installed app (phone APK / Windows): if a newer version was downloaded with "Yenilə", run that one instead of the built-in file */
var K="zsupd."+ZS_APP;try{var L=location;if(!(L.protocol==="file:"||window.Capacitor||(L.hostname==="localhost"&&!L.port)))return;
if(/[?&]zsorig=1/.test(L.search)||sessionStorage.getItem(K+".off"))return;var v=+localStorage.getItem(K+".v")||0;
if(v<ZS_BUILD){if(v){localStorage.removeItem(K+".v")}return}if(v===ZS_BUILD)return;
window.ZS_UPD_LOADING=1;document.write("<plaintext style=\"display:none\">");
var bad=function(){try{localStorage.removeItem(K+".v")}catch(e){}L.reload()};
var r=indexedDB.open("zsupd",1);r.onupgradeneeded=function(){r.result.createObjectStore("f")};r.onerror=bad;
r.onsuccess=function(){try{var g=r.result.transaction("f").objectStore("f").get(ZS_APP);g.onerror=bad;g.onsuccess=function(){var x=g.result;
if(x&&x.v===v&&x.html&&x.html.indexOf("ZS_BUILD="+v+";")>0&&x.html.indexOf('ZS_APP="'+ZS_APP+'"')>0){document.open();document.write(x.html);document.close()}else bad()}}catch(e){bad()}}}catch(e){}})();</script>
<script>/* ZUVAND — proqramı yeniləmək: Ayarlar → "Yeniləmə". Telefon (APK) və Windows proqramı yeni versiyanı GitHub-dan yükləyir;
   ZUVAND Servis kompüterində (hub) rəhbər hub-ı özü yeniləyir; Google və iPhone versiyaları həmişə son versiyadadır. */
window.ZSUPD=(function(){
  const RAW="https://raw.githubusercontent.com/reportzuvand-tech/";
  const SRC={ups:["ups-servis/main/www/","version.json"],sa:["satis-anbar-web/main/app/","version.json"],zs:["zuvand-servis/main/","version.json"],zssa:["zuvand-servis/main/","version.json"]};
  let O=null,info=null,busy=false;
  const app=()=>window.ZS_APP||"",cur=()=>+window.ZS_BUILD||0,K=s=>"zsupd."+app()+"."+s;
  const LSg=k=>{try{return localStorage.getItem(k)}catch(e){return null}},LSs=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
  const L=location,packaged=()=>L.protocol==="file:"||!!window.Capacitor||(L.hostname==="localhost"&&!L.port);
  const mode=()=>{if(packaged())return "app";if(O&&O.hub&&O.hub())return "hub";if(O&&O.gas&&O.gas())return "gas";if(/github\.io$/.test(L.hostname))return "pwa";return "web"};
  const fmtV=v=>{v=String(v||"");return v.length>=10?v.slice(6,8)+"."+v.slice(4,6)+"."+v.slice(0,4)+" №"+(+v.slice(8)):(v||"—")};
  const esc=x=>String(x==null?"":x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
  const toast=(t,ms)=>{try{O&&O.toast?O.toast(t,ms):0}catch(e){}};
  function idb(fn){return new Promise((res,rej)=>{const r=indexedDB.open("zsupd",1);r.onupgradeneeded=()=>r.result.createObjectStore("f");r.onerror=()=>rej(r.error);
    r.onsuccess=()=>{const tx=r.result.transaction("f","readwrite"),st=tx.objectStore("f");let out;Promise.resolve(fn(st)).then(x=>{out=x});tx.oncomplete=()=>res(out);tx.onerror=()=>rej(tx.error)}})}
  async function getText(u){const r=await fetch(u+(u.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);return r.text()}
  async function hubCall(action,d){const r=await fetch(L.origin+"/api",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.assign({action,key:O.key?O.key():""},d||{}))});const j=await r.json();if(!j.ok)throw new Error(j.error||"server");return j}
  /* is there a newer version? */
  async function check(silent){const m=mode();try{
      if(m==="app"){const s=SRC[app()];if(!s)return null;const j=JSON.parse(await getText(RAW+s[0]+s[1]));info={latest:+j.v||0,notes:j.notes||"",files:j.files||{},base:RAW+s[0]}}
      else if(m==="hub"){if(!O.isAdmin())return null;const j=await hubCall("upd_check");info={latest:+j.latest||0,hubCur:+j.cur||0,notes:j.notes||""}}
      else return null;
      info.at=Date.now();LSs(K("seen"),String(info.latest));
      const newer=m==="hub"?info.latest>info.hubCur:info.latest>cur();
      if(newer&&silent)toast("Yeni versiya var ("+fmtV(info.latest)+") — Ayarlar → “Yeniləmə” → “Yenilə”",9000);
      return info}catch(e){if(!silent)toast("Yeniləməni yoxlamaq alınmadı: "+(e&&e.message||e)+" (internet?)");return null}finally{if(document.getElementById("updCard"))card()}}
  /* download and switch to the new version */
  async function apply(){if(busy)return;busy=true;const msg=t=>{const e=document.getElementById("updMsg");if(e)e.textContent=t};
    try{const m=mode();
      if(m==="hub"){msg("Hub yenilənir…");const r=await hubCall("upd_apply");msg("Hub yeniləndi ("+fmtV(r.v)+") — yenidən başlayır…");
        let n=0;const wait=async()=>{n++;try{const s=await fetch(L.origin+"/status?t="+Date.now(),{cache:"no-store"});if(s.ok&&n>2){L.reload();return}}catch(e){}if(n<40)setTimeout(wait,1500);else msg("Hub cavab vermir — Hub-ı əl ilə başladın")};setTimeout(wait,2500);return}
      if(!info||!info.latest)await check(false);if(!info||!(info.latest>cur())){msg("Artıq son versiyadır");busy=false;return}
      const v=info.latest,F=Object.entries(info.files||{});if(!F.length)throw new Error("versiya faylı natamamdır");
      const got=[];for(let i=0;i<F.length;i++){const [a,f]=F[i];msg("Yüklənir: "+(i+1)+" / "+F.length);const html=await getText(info.base+f);
        if(html.indexOf("ZS_BUILD="+v+";")<0||html.indexOf('ZS_APP="'+a+'"')<0)throw new Error("yüklənən fayl yoxlamadan keçmədi");got.push([a,html])}
      await idb(st=>{got.forEach(([a,html])=>st.put({v,html,at:Date.now()},a))});
      got.forEach(([a])=>{LSs("zsupd."+a+".v",String(v));try{sessionStorage.removeItem("zsupd."+a+".off")}catch(e){}});
      msg("Yeni versiya quraşdırıldı — proqram yenidən açılır…");setTimeout(()=>L.reload(),900)}
    catch(e){msg("Yeniləmə alınmadı: "+(e&&e.message||e));toast("Yeniləmə alınmadı: "+(e&&e.message||e))}finally{busy=false}}
  async function revert(){const a=Object.keys(SRC).filter(k=>SRC[k][0]===(SRC[app()]||[])[0]);try{await idb(st=>{a.forEach(k=>st.delete(k))})}catch(e){}a.forEach(k=>LSs("zsupd."+k+".v",null));L.reload()}
  function card(){const main=document.getElementById("main");if(!main||!O)return;const m=mode(),old=document.getElementById("updCard");
    let body="";
    if(m==="gas")body=`<p class="note" style="margin:0">Bu Google (veb) versiyasıdır — həmişə son versiya açılır, yeniləmək lazım deyil.</p>`;
    else if(m==="pwa")body=`<p class="note" style="margin:0">iPhone versiyası özü yenilənir: proqramı tam bağlayıb yenidən açın. Versiya: <b>${fmtV(cur())}</b></p><div class="actions"><button class="btn" id="updReload">Yenidən yüklə</button></div>`;
    else if(m==="web")body=`<p class="note" style="margin:0">Versiya: <b>${fmtV(cur())}</b></p>`;
    else if(m==="hub"&&!O.isAdmin())body=`<p class="note" style="margin:0">Versiya: <b>${fmtV(cur())}</b>. ZUVAND Servis-i rəhbər yeniləyir.</p>`;
    else{const latest=info&&info.latest,have=m==="hub"?(info&&info.hubCur)||cur():cur(),newer=latest&&latest>have,stored=m==="app"&&+LSg(K("v"))===cur();
      body=`<p class="note" style="margin:0 0 8px">${m==="hub"?"Bu kompüterdəki ZUVAND Servis (hub) yeni versiyanı internetdən yükləyib özü yenidən başlayır. Telefonlardakı ZUVAND Servis proqramı öz Ayarlarından yenilənir.":"Yeni versiya çıxanda burada “Yenilə” düyməsi görünür — basın, proqram yeni versiyanı yükləyib yenidən açılır. APK və ya proqramı yenidən quraşdırmaq lazım deyil. İnternet yoxdursa, köhnə versiya işləməyə davam edir."}</p>
        <p style="margin:0 0 8px">Hazırkı versiya: <b>${fmtV(have)}</b>${latest?` · son versiya: <b>${fmtV(latest)}</b>`:""}${info&&info.at?` <span class="note">(yoxlanıldı ${new Date(info.at).toLocaleTimeString().slice(0,5)})</span>`:""}</p>
        ${newer?`<div class="banner" style="margin:0 0 8px"><b>Yeni versiya var.</b>${info.notes?"<br>"+esc(info.notes).replace(/\n/g,"<br>"):""}</div>`:latest?`<p class="note" style="margin:0 0 8px">✓ Son versiyadır.</p>`:""}
        <div class="actions">${newer?`<button class="btn pri" id="updGo">Yenilə</button>`:""}<button class="btn" id="updChk">Yeniləməni yoxla</button>${stored?`<button class="btn ghost" id="updRev">Quraşdırılmış versiyaya qayıt</button>`:""}</div>`}
    const h=`<div class="card" id="updCard" style="margin-top:12px"><h3>Yeniləmə</h3>${body}<p class="note" id="updMsg" style="margin:6px 0 0"></p></div>`;
    if(old)old.outerHTML=h;else main.insertAdjacentHTML("beforeend",h);
    const g=id=>document.getElementById(id);
    if(g("updChk"))g("updChk").onclick=async()=>{g("updMsg").textContent="Yoxlanılır…";const r=await check(false);if(r&&g("updMsg")&&!g("updGo"))g("updMsg").textContent="Son versiyadır"};
    if(g("updGo"))g("updGo").onclick=()=>apply();
    if(g("updRev"))g("updRev").onclick=()=>revert();
    if(g("updReload"))g("updReload").onclick=async()=>{try{const r=await navigator.serviceWorker.getRegistration();if(r)await r.update()}catch(e){}L.reload()}}
  function init(o){O=o;const m=mode();if(m!=="app"&&m!=="hub")return;
    const last=+LSg(K("chk"))||0;if(Date.now()-last>6*3600e3)setTimeout(()=>{if(navigator.onLine===false)return;if(m==="hub"&&!O.isAdmin())return;LSs(K("chk"),String(Date.now()));check(true)},20000)}
  return {init,card,check,apply,revert,mode}})();
</script>
<script>/* ZUVAND — təhlükəsizlik: proqram kilidi (PIN), fəaliyyət jurnalı, zavod sıfırlaması (parol ilə).
   Sıfırlamadan sonra bütün telefon və kompüterlər serverə qoşulanda öz yaddaşındakı köhnə məlumatı avtomatik silir. */
window.ZSSEC=(function(){
  let O=null,info=null,busy=false,lastAct=Date.now(),locked=false;
  const LSg=k=>{try{return localStorage.getItem(k)}catch(e){return null}},LSs=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
  const esc=x=>String(x==null?"":x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
  const toast=(t,ms)=>{try{O&&O.toast?O.toast(t,ms):0}catch(e){}};
  const g=id=>document.getElementById(id);
  const hub=()=>!!(O&&O.hub&&O.hub());
  const fam=()=>hub()?"hub":(O&&O.app)||"x";
  /* SHA-256 (crypto.subtle is missing on plain http in the office network) */
  function sha256js(str){const K=[1116352408,1899447441,3049323471,3921009573,961987163,1508970993,2453635748,2870763221,3624381080,310598401,607225278,1426881987,1925078388,2162078206,2614888103,3248222580,3835390401,4022224774,264347078,604807628,770255983,1249150122,1555081692,1996064986,2554220882,2821834349,2952996808,3210313671,3336571891,3584528711,113926993,338241895,666307205,773529912,1294757372,1396182291,1695183700,1986661051,2177026350,2456956037,2730485921,2820302411,3259730800,3345764771,3516065817,3600352804,4094571909,275423344,430227734,506948616,659060556,883997877,958139571,1322822218,1537002063,1747873779,1955562222,2024104815,2227730452,2361852424,2428436474,2756734187,3204031479,3329325298];
    const b=new TextEncoder().encode(str),l=b.length,n=((l+9+63)>>6)<<6,m=new Uint8Array(n);m.set(b);m[l]=128;const dv=new DataView(m.buffer);dv.setUint32(n-4,l*8>>>0);dv.setUint32(n-8,Math.floor(l/536870912));
    let H=[1779033703,3144134277,1013904242,2773480762,1359893119,2600822924,528734635,1541459225];const w=new Array(64),r=(x,k)=>(x>>>k)|(x<<(32-k));
    for(let o=0;o<n;o+=64){for(let i=0;i<16;i++)w[i]=dv.getUint32(o+i*4);for(let i=16;i<64;i++){const s0=r(w[i-15],7)^r(w[i-15],18)^(w[i-15]>>>3),s1=r(w[i-2],17)^r(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0}
      let [a,bb,c,d,e,f,gg,h]=H;for(let i=0;i<64;i++){const S1=r(e,6)^r(e,11)^r(e,25),ch=(e&f)^(~e&gg),t1=(h+S1+ch+K[i]+w[i])|0,S0=r(a,2)^r(a,13)^r(a,22),mj=(a&bb)^(a&c)^(bb&c),t2=(S0+mj)|0;h=gg;gg=f;f=e;e=(d+t1)|0;d=c;c=bb;bb=a;a=(t1+t2)|0}
      H=[H[0]+a|0,H[1]+bb|0,H[2]+c|0,H[3]+d|0,H[4]+e|0,H[5]+f|0,H[6]+gg|0,H[7]+h|0]}
    return H.map(x=>(x>>>0).toString(16).padStart(8,"0")).join("")}
  async function sha(t){t=String(t);try{if(window.crypto&&crypto.subtle){const h=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join("")}}catch(e){}return sha256js(t)}
  const ERR={badpw:"Parol səhvdir",nopw:"Əvvəlcə sıfırlama parolu təyin edin",locked:"Çox səhv cəhd — 30 dəqiqə gözləyin",forbidden:"Bu əməliyyat yalnız rəhbərə açıqdır",confirm:"Təsdiq sözü səhvdir",bad_pw:"Parol düzgün deyil",auth:"Açar qəbul edilmədi",offline:"İnternet / şəbəkə yoxdur"};
  const em=e=>ERR[(e&&e.data&&e.data.error)||(e&&e.message)]||(e&&e.message)||String(e);

  /* ---------- this device's data ---------- */
  const PFX={ups:["ups."],sa:["sa."],hub:["ups.","sa."]};
  const KEEP=["ups.me","ups.rootpath","ups.actdir","ups.actdirpos","ups.pdfdrive","sa.me","sa.srv2","sa.rootpath","sa.pdfDrive","sa.vdir"];
  const IDBS={ups:["ups-data","ups-photos"],sa:["sa-pdf"],hub:["ups-data","ups-photos","sa-pdf"]};
  function clearIdb(name){return new Promise(res=>{let done=false;const fin=()=>{if(!done){done=true;res()}};setTimeout(fin,4000);
    try{const q=indexedDB.open(name);q.onupgradeneeded=()=>{try{q.transaction.abort()}catch(e){}};q.onerror=fin;
      q.onsuccess=()=>{const db=q.result,S=[...db.objectStoreNames];if(!S.length){db.close();return fin()}try{const tx=db.transaction(S,"readwrite");S.forEach(s=>tx.objectStore(s).clear());tx.oncomplete=()=>{db.close();fin()};tx.onerror=()=>{db.close();fin()}}catch(e){db.close();fin()}}}catch(e){fin()}})}
  async function wipe(full){const P=PFX[fam()]||[],keep=full?[]:KEEP;
    const ks=[];try{for(let i=0;i<localStorage.length;i++)ks.push(localStorage.key(i))}catch(e){}
    ks.forEach(k=>{if(k&&P.some(p=>k.indexOf(p)===0)&&keep.indexOf(k)<0)LSs(k,null)});
    if(full)["zssec.pin","zssec.idle"].forEach(k=>LSs(k,null));
    for(const n of IDBS[fam()]||[])await clearIdb(n)}

  /* ---------- after a factory reset on the server every device clears its old copy ---------- */
  const DATAK={ups:["ups.remote","ups.reports","ups.pending"],sa:["sa.cache","sa.quotes","sa.outbox"]};
  const hasLocal=()=>(fam()==="hub"?DATAK.ups.concat(DATAK.sa):DATAK[fam()]||[]).some(k=>{const v=LSg(k);return v&&v.length>4});
  let had0=null;
  const EK=()=>"zssec.ep."+fam();
  async function checkEpoch(){if(!O||busy||!O.logged||!O.logged())return;
    try{info=await O.api("sec_info",{});const ep=+info.epoch||0,sv=LSg(EK()),st=+sv||0;
      if(ep&&ep!==st&&(sv!=null||had0)){busy=true;await wipe(false);LSs(EK(),String(ep));try{sessionStorage.setItem("zssec.msg","1")}catch(e){}location.reload();return}
      if(sv==null)LSs(EK(),String(ep));if(g("secCard"))card()}catch(e){}}

  /* ---------- PIN lock (this device only) ---------- */
  const idleMin=()=>{const v=LSg("zssec.idle");return v==null?5:+v};
  function lockNow(){if(locked||!LSg("zssec.pin"))return;locked=true;let tries=+(LSg("zssec.tries")||0);
    const ov=document.createElement("div");ov.id="secLock";ov.setAttribute("role","dialog");ov.setAttribute("aria-modal","true");
    ov.innerHTML=`<div class="sl-in"><div class="sl-ic">🔒</div><b>Proqram kilidlənib</b><p>PIN kodu daxil edin</p>
      <input id="slPin" type="password" inputmode="numeric" autocomplete="off" maxlength="12" aria-label="PIN kodu"><p class="sl-err" id="slErr"></p>
      <button class="btn pri" id="slGo">Aç</button><button class="sl-link" id="slForgot">PIN-i unutmusunuz?</button></div>`;
    document.body.appendChild(ov);const inp=g("slPin");setTimeout(()=>inp.focus(),50);
    const go=async()=>{const wait=+(LSg("zssec.wait")||0);if(wait>Date.now()){g("slErr").textContent="Gözləyin: "+Math.ceil((wait-Date.now())/1000)+" san.";return}
      const h=await sha("zspin:"+inp.value);if(h===LSg("zssec.pin")){LSs("zssec.tries","0");locked=false;lastAct=Date.now();ov.remove();return}
      tries++;LSs("zssec.tries",String(tries));inp.value="";const w=tries>=5?Math.min(300,(tries-4)*30):0;if(w)LSs("zssec.wait",String(Date.now()+w*1000));
      g("slErr").textContent="PIN səhvdir"+(w?" — "+w+" san. gözləyin":"")};
    g("slGo").onclick=go;inp.onkeydown=e=>{if(e.key==="Enter")go()};
    g("slForgot").onclick=async()=>{if(!confirm("PIN-i unutmusunuzsa, bu cihazdakı bütün məlumat və giriş açarı silinəcək (serverdəki məlumat qalır). Sonra açarla yenidən daxil olmalısınız. Davam edilsin?"))return;
      await wipe(true);location.reload()}}
  function touch(){if(!locked)lastAct=Date.now()}
  function idleCheck(){const m=idleMin();if(!LSg("zssec.pin")||locked||m<=0)return;if(Date.now()-lastAct>m*60000)lockNow()}

  /* ---------- the "Təhlükəsizlik" card in Ayarlar ---------- */
  function css(){if(g("secCss"))return;document.head.insertAdjacentHTML("beforeend",`<style id="secCss">
    #secLock{position:fixed;inset:0;z-index:2147483000;background:var(--bg,#F4F7F6);display:flex;align-items:center;justify-content:center;padding:16px}
    #secLock .sl-in{display:grid;gap:10px;justify-items:center;text-align:center;max-width:300px;width:100%}#secLock .sl-ic{font-size:44px}
    #secLock input{font-size:24px;letter-spacing:8px;text-align:center;padding:10px;width:100%;border:1px solid var(--line,#C9D3D0);border-radius:10px}
    #secLock .sl-err{color:#B42318;min-height:18px;margin:0}#secLock .sl-link{background:none;border:0;color:var(--muted,#5B6B67);text-decoration:underline;cursor:pointer}
    .secov{position:fixed;inset:0;z-index:100000;background:rgba(10,20,18,.45);display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow:auto}
    .secov .in{background:var(--card,#fff);color:inherit;border-radius:14px;max-width:820px;width:100%;padding:16px;display:grid;gap:10px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
    .secov .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}.secov table{width:100%;border-collapse:collapse;font-size:13px}
    .secov td,.secov th{border-bottom:1px solid var(--line,#E2E8E6);padding:6px 4px;text-align:left;vertical-align:top}.secov th{position:sticky;top:0;background:var(--card,#fff)}
    .secov .tw{max-height:65vh;overflow:auto}.secov label.ck{display:flex!important;gap:10px;align-items:center;text-align:left}.secov label.ck input{width:20px!important;height:20px!important;flex:none;margin:0}.secov input[type=text],.secov input[type=password]{width:100%;padding:9px;border:1px solid var(--line,#C9D3D0);border-radius:8px;font-size:15px}
    #secCard .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}#secCard input,#secCard select{padding:8px;border:1px solid var(--line,#C9D3D0);border-radius:8px;font-size:15px;max-width:180px}
    .sec-danger{border:1px solid #F3B4AE;background:#FFF5F4;border-radius:10px;padding:10px;margin-top:8px}.sec-danger .btn.red{background:#C0392B;color:#fff;border-color:#C0392B}

<style>
/* Layout: field-instrument app — sticky header, horizontal section tabs, one column of form cards; report renders as a white A4 sheet */
:root{
  --bg:#EDF1EF; --surface:#FFFFFF; --surface2:#E2E8E5; --ink:#15201D; --muted:#5A6964; --line:#C9D3CF;
  --accent:#0E6A5B; --accent-ink:#FFFFFF; --accent-soft:#D4EAE5;
  --ok:#23704A; --ok-bg:#DAF0E2; --warn:#7F5A00; --warn-bg:#FAEDC4; --bad:#AE2014; --bad-bg:#FADDD8; --idle:#8A9893;
  --paper:#FFFFFF; --paper-ink:#1B1F1E; --paper-line:#B9C2BF; --paper-head:#123B35; --paper-soft:#E6EEEB;
  --f-body:"Noto Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-disp:"Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --f-num:"Roboto Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1513; --surface:#18201D; --surface2:#222C29; --ink:#E3EBE7; --muted:#93A29D; --line:#303C38;
  --accent:#43B9A2; --accent-ink:#04201A; --accent-soft:#173A33;
  --ok:#74D39C; --ok-bg:#173327; --warn:#F0C45E; --warn-bg:#3A2F12; --bad:#FF8E7E; --bad-bg:#3E1D19; --idle:#6F7E79;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1513; --surface:#18201D; --surface2:#222C29; --ink:#E3EBE7; --muted:#93A29D; --line:#303C38;
  --accent:#43B9A2; --accent-ink:#04201A; --accent-soft:#173A33;
  --ok:#74D39C; --ok-bg:#173327; --warn:#F0C45E; --warn-bg:#3A2F12; --bad:#FF8E7E; --bad-bg:#3E1D19; --idle:#6F7E79;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 96px}
.cols2{display:grid;gap:0 16px}
.col{min-width:0}
@media (min-width:1000px){.wrap,header.top .bar,header.top .tabs{max-width:1120px}.cols2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.cols2 .col>.card:first-child{margin-top:0}}
.drop{display:grid;place-items:center;border:2px dashed var(--line);border-radius:var(--r);padding:20px 12px;text-align:center;cursor:pointer;background:var(--bg);color:var(--muted)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.drop b{color:var(--accent)}
.maptbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.maptbl table{border-collapse:collapse;width:100%;font-size:12px}
.maptbl th,.maptbl td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;white-space:nowrap;font-variant-numeric:tabular-nums}
.maptbl th{background:var(--surface2);position:sticky;top:0}
.maptbl td.num{font-family:var(--f-num)}
.fsum{display:flex;gap:8px;flex-wrap:wrap}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .bar{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{font:700 20px/1 var(--f-disp);letter-spacing:.02em;text-transform:uppercase;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font:500 12px/1.3 var(--f-body);letter-spacing:0;text-transform:none;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis}
.save{font-size:12px;color:var(--muted);white-space:nowrap}
.sync{font-size:12px;font-weight:600;white-space:nowrap;color:var(--muted)}.sync.ok{color:var(--ok)}.sync.warn{color:var(--warn)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:42px}
.btn:focus-visible,.tab:focus-visible,.tcard:focus-visible,.dchip:focus-visible,.seg button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chip:focus-visible,.rcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.5}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:0 12px 8px;max-width:760px;margin:0 auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;padding:8px 12px;border-radius:20px;font:600 14px/1 var(--f-disp);letter-spacing:.03em;text-transform:uppercase;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:6px}
.tab .n{font:500 11px var(--f-num);opacity:.7}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tab.subtab{font:600 13px/1 var(--f-body,inherit);text-transform:none;letter-spacing:0;padding:6px 11px;border:1px solid var(--line)}
.tab.subtab[aria-selected="true"]{background:var(--accent,#1f6f5c);border-color:var(--accent,#1f6f5c);color:#fff}
h2.sec{font:700 22px/1.15 var(--f-disp);text-transform:uppercase;letter-spacing:.02em;margin:22px 0 4px;text-wrap:balance}
p.hint{color:var(--muted);font-size:13px;margin:0 0 14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px;margin-bottom:12px}
.card h3{margin:0;font:700 15px/1.2 var(--f-disp);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:440px){.grid2{grid-template-columns:1fr}}
label.f{display:grid;gap:4px;min-width:0}
label.f>span{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
input,select,textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 11px;min-height:44px}
textarea{min-height:84px;resize:vertical}

.paper .qhead{display:flex;justify-content:space-between;gap:16px;margin-top:10px}
.paper .party{flex:1;border:1px solid var(--paper-line);padding:6px 8px}
.paper .party .lb{font:700 9.5px var(--f-disp);letter-spacing:.08em;text-transform:uppercase;color:var(--paper-head);margin-bottom:3px}
.paper .party b{font-size:12px}
.paper .party div{line-height:1.45}
.paper p.intro{margin:12px 0 8px}
.paper table.qt th{font-size:10px}
.paper table.qt td{font-size:10.5px}
.paper table.qt td.r,.paper table.qt th.r{text-align:right;white-space:nowrap}
.paper table.qt td .d{display:block;font-size:9.5px;color:#55605C;white-space:pre-line}
.paper table.qt td .c{font:500 9px var(--f-num);color:#55605C}
.paper table.qt tr{break-inside:avoid;page-break-inside:avoid}
.paper table.qt tr.qsec td{background:var(--paper-head);color:#fff;font:700 10.5px var(--f-disp);letter-spacing:.08em;text-transform:uppercase;padding:5px 7px}
.paper table.qt tr.qsec td span{font:400 9.5px var(--f-body);letter-spacing:0;text-transform:none;opacity:.85;margin-left:6px}
.paper table.qt tr.qsub td{background:var(--paper-soft);font-weight:700}
.paper table.tt{width:52%;margin-left:auto;margin-top:-1px}
.paper table.tt td{text-align:right;font-size:11px}
.paper table.tt td:first-child{background:var(--paper-soft);font-weight:700}
.paper table.tt tr.g td{font-size:12.5px;font-weight:700;background:var(--paper-head);color:#fff;border-color:var(--paper-head)}
.paper .words{margin:6px 0 0;text-align:right;font-style:italic}
.paper td.tv{white-space:pre-line}
.paper .bank{white-space:pre-line;border:1px solid var(--paper-line);padding:6px 8px;font-size:10px}
.paper .qsig{display:grid;grid-template-columns:1.2fr 1fr;gap:30px;margin-top:20px;break-inside:avoid;page-break-inside:avoid}
.paper .qsig .ln{border-bottom:1px solid #555;height:34px}
.paper .stamp{font-size:9.5px;color:#55605C;margin-top:4px}
#printHost{display:none}
#pw{max-width:739px}

  body{background:#fff}

}

<script>
/* ================= Satış və Anbar — CORE =================
   The same code runs in two places:
   • on the Google Apps Script server (file Core.gs) — the real rules, enforced there;
   • in the app's demo mode (no server) — so the program can be tried without setup.
   saHandle(db,user,action,payload) reads the in-memory database and returns {res, ch}:
   res = answer for the app, ch = changed rows the caller must save. */
var SA_ROLES={isci:"İşçi (satış)",anbardar:"Anbardar",muhasib:"Mühasib",admin:"Rəhbər"};
var SA_ROLE_ALIASES={"işçi":"isci","isci":"isci","satış":"isci","anbardar":"anbardar","mühasib":"muhasib","muhasib":"muhasib","mühasibat":"muhasib","rəhbər":"admin","rehber":"admin","admin":"admin","müdir":"admin"};
/* ZUVAND Servis: a person's rights are the modules the manager ticked for them.
   role = "admin" (rəhbər, everything) or "p:satis,anbar,…"; the old role names still work. */
var SA_MODS={servis:"Servis hesabatları",tesdiq:"Təsdiq və tapşırıqlar",satis:"Satış (təkliflər)",anbar:"Anbar",muhasibat:"Mühasibat",xerc:"Xərclər və maaşlar"};
function saPerms(r){r=String(r||"");var o={};if(r==="admin"){for(var k in SA_MODS)o[k]=1;o.admin=1;return o}
  if(r.indexOf("p:")===0){r.slice(2).split(",").forEach(function(x){x=x.trim();if(SA_MODS[x])o[x]=1});return o}
  if(r==="isci")o.satis=1;else if(r==="anbardar")o.anbar=1;else if(r==="muhasib"){o.muhasibat=1;o.satis=1;o.xerc=1}return o}
function saHas(r){var P=saPerms(r);for(var i=1;i<arguments.length;i++)if(P[arguments[i]])return true;return !!P.admin}
var SA_CAN={
  seeCost:function(r){return saHas(r,"muhasibat")},           /* gəliş qiyməti, mənfəət */
  editItem:function(r){return saHas(r,"anbar","muhasibat")},
  setPrice:function(r){return saHas(r,"muhasibat")},          /* gəliş + satış qiyməti, hesab-ödəniş */
  moveStock:function(r){return saHas(r,"anbar")},             /* mədaxil / məxaric / düzəliş */
  seeMoves:function(r){return saHas(r,"anbar","muhasibat")},
  quote:function(r){return saHas(r,"satis","muhasibat")},
  invoice:function(r){return saHas(r,"muhasibat")},           /* qaiməni daxil edib təsdiqləmək */
  receive:function(r){return saHas(r,"anbar")},               /* qaimə üzrə malı anbarda qəbul etmək */
  contract:function(r){return saHas(r,"muhasibat")},          /* xidməti müqavilələr */
  seeContracts:function(r){return saHas(r,"satis","muhasibat")},
  editAnyQuote:function(r){return saHas(r,"muhasibat")},
  linePrice:function(r){return saHas(r,"muhasibat")},
  unlimitedDisc:function(r){return saHas(r,"muhasibat")},
  expense:function(r){return saHas(r,"xerc")},               /* ofis xərcləri, maaşlar, vergilər */
  admin:function(r){return saPerms(r).admin===1}
};
function saRoleLabel(r){r=String(r||"");if(SA_ROLES[r])return SA_ROLES[r];var P=saPerms(r);return Object.keys(SA_MODS).filter(function(k){return P[k]}).map(function(k){return SA_MODS[k]}).join(", ")||"—"}
var SA_STATUS={draft:"Qaralama",sent:"Göndərildi",accepted:"Qəbul edildi",rejected:"İmtina",done:"Təhvil verildi"};
var SA_KIND={in:"Mədaxil",out:"Məxaric",adj:"Düzəliş"};
/* company expenses (mühasibat): office, salaries, taxes, other */
var SA_EXP_CATS=["Ofis icarəsi","Kommunal (işıq, su, qaz)","İnternet və telefon","Maaş","Vergi və sosial ödənişlər","Nəqliyyat və yanacaq","Dəftərxana və ofis ləvazimatı","Bank xərcləri","Təmir və avadanlıq","Reklam","Anbar itkisi (silinmə)","Digər"];
var SA_EXP_PAY=["Köçürmə","Nağd","Kart"];
var SA_PERIOD={m:["Aylıq",1],q:["Rüblük",3],h:["Yarımillik",6],y:["İllik",12]};
/* "2026 — IV rüb", "Oktyabr 2026" … : which period of the contract a sale belongs to */
var SA_MONTHS=["Yanvar","Fevral","Mart","Aprel","May","İyun","İyul","Avqust","Sentyabr","Oktyabr","Noyabr","Dekabr"],SA_ROMAN=["I","II","III","IV"];
function saPeriodLabel(date,per){var m=/^(\d{4})-(\d{2})/.exec(String(date||""));if(!m)return "";var y=m[1],mo=+m[2]-1;
  if(per==="m")return SA_MONTHS[mo]+" "+y;if(per==="h")return y+" — "+(mo<6?"I":"II")+" yarımil";if(per==="y")return y+"-ci il";return y+" — "+SA_ROMAN[Math.floor(mo/3)]+" rüb"}
var SA_INV_STATUS={draft:"Qaralama",approved:"Anbarda yoxlanır",received:"Qəbul edildi"};
var SA_CATS=["UPS","Akkumulyator","Stabilizator","Dizel generator","Elektrik paneli / ATS","Ehtiyat hissə","Kabel və aksesuar","Xidmət"];
var SA_UNITS=["ədəd","dəst","metr","kq","litr","saat","xidmət"];
var SA_DEFAULTS={co:"ZUVAND Grand System",coaddr:"",cotel:"",coemail:"",covoen:"",bank:"",prefix:"TK",valid:15,vat:18,maxDisc:10,
  pay:"50% avans, qalan 50% təhvil-təslimdən sonra 5 iş günü ərzində",
  delivery:"Anbarda olan mallar — 3 iş günü; sifarişlə gətirilən mallar — 4–6 həftə",
  warranty:"Avadanlıq üçün istehsalçı zəmanəti — 12 ay; görülən işlərə — 6 ay",note:"",svcSheet:"",svcFrom:""};
var SA_SETTING_KEYS=Object.keys(SA_DEFAULTS);

function saNum(v){if(v===null||v===undefined||v==="")return 0;if(typeof v==="number")return isFinite(v)?v:0;
  var n=parseFloat(String(v).replace(/\s/g,"").replace(",","."));return isFinite(n)?n:0}
function saR2(n){return Math.round((n+Number.EPSILON)*100)/100}
function saId(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function saRole(v){var k=String(v||"").trim().toLowerCase();return SA_ROLE_ALIASES[k]||(SA_ROLES[k]?k:"")}
function saStr(v,max){return String(v==null?"":v).slice(0,max||500)}

function saLineSum(l){return saR2(saNum(l.qty)*saNum(l.price)*(1-saNum(l.disc)/100))}
function saTotals(q){var gross=0,net=0;(q.lines||[]).forEach(function(l){gross+=saR2(saNum(l.qty)*saNum(l.price));net+=saLineSum(l)});
  net=saR2(net);gross=saR2(gross);var rate=q.vat===false?0:saNum(q.vatRate);var vat=saR2(net*rate/100);
  return {gross:gross,disc:saR2(gross-net),net:net,rate:rate,vat:vat,total:saR2(net+vat)}}

/* stock: q = qalıq (in − out ± adj), r = rezerv (accepted quotes, not yet issued), a = mövcud */
function saIssued(db){var m={};db.moves.forEach(function(x){if(x.del||x.kind!=="out"||!x.quoteId)return;var k=x.quoteId+"|"+x.itemId;m[k]=(m[k]||0)+saNum(x.qty)});return m}
/* a quote line is goods ("mal": reserved and issued from the warehouse) or a service ("xid": installation, rack, labour — never touches stock) */
function saLineType(l,items){if(l.t==="mal"||l.t==="xid")return l.t;if(l.svc===1)return "xid";if(l.svc===2)return "mal";var it=l.itemId&&items?items[l.itemId]:null;if(it)return it.svc?"xid":"mal";return "xid"}
function saQuoteNeed(q,items){var need={};(q.lines||[]).forEach(function(l){if(!l.itemId)return;var it=items[l.itemId];if(!it||it.svc||saLineType(l,items)==="xid")return;need[l.itemId]=(need[l.itemId]||0)+saNum(l.qty)});return need}
function saStock(db){var S={},items={};db.items.forEach(function(i){items[i.id]=i;S[i.id]={q:0,r:0,a:0}});
  db.moves.forEach(function(m){if(m.del||!S[m.itemId])return;var n=saNum(m.qty);S[m.itemId].q+=m.kind==="out"?-n:n});
  var iss=saIssued(db);
  db.quotes.forEach(function(q){if(q.del||q.status!=="accepted")return;var need=saQuoteNeed(q,items);
    Object.keys(need).forEach(function(id){if(!S[id])return;S[id].r+=Math.max(0,need[id]-(iss[q.id+"|"+id]||0))})});
  Object.keys(S).forEach(function(id){var s=S[id];s.q=saR2(s.q);s.r=saR2(s.r);s.a=saR2(s.q-s.r)});return S}
function saRemaining(db,q){var items={};db.items.forEach(function(i){items[i.id]=i});var need=saQuoteNeed(q,items),iss=saIssued(db),out={};
  Object.keys(need).forEach(function(id){out[id]={need:need[id],issued:iss[q.id+"|"+id]||0,left:Math.max(0,saR2(need[id]-(iss[q.id+"|"+id]||0)))}});return out}

function saPubItem(i,role){var o={};for(var k in i)o[k]=i[k];if(!SA_CAN.seeCost(role)){delete o.cost}return o}
function saNormName(s){return String(s||"").toLocaleLowerCase("az").replace(/\u0307/g,"").replace(/ı/g,"i").replace(/ə/g,"e").replace(/ö/g,"o").replace(/ü/g,"u").replace(/ş/g,"s").replace(/ç/g,"c").replace(/ğ/g,"g").replace(/[^a-z0-9]+/g," ").trim()}
function saInvTotals(v){var net=0,vat=0;(v.lines||[]).forEach(function(l){var s=saR2(saNum(l.qty)*saNum(l.price));net+=s;vat+=saNum(l.vat)});net=saR2(net);vat=saR2(vat);return {net:net,vat:vat,total:saR2(net+vat)}}
function saPubInv(v,role){var o={};for(var k in v)o[k]=v[k];if(!SA_CAN.seeCost(role)){o.lines=(v.lines||[]).map(function(l){var c={};for(var k in l)if(k!=="price"&&k!=="vat"&&k!=="sum"&&k!=="fprice")c[k]=l[k];return c});delete o.net;delete o.vat;delete o.total;if(o.imp)o.imp={cur:o.imp.cur,gb:o.imp.gb}}
  else{var t=saInvTotals(v);o.net=t.net;o.vat=t.vat;o.total=t.total}return o}
function saPubMove(m,role){var o={};for(var k in m)o[k]=m[k];if(!SA_CAN.seeCost(role))delete o.cost;return o}
function saKindOf(q){return q.kind==="svc"||q.kind==="sale"?q.kind:(q.src&&q.src.type==="service"?"svc":"sale")}
function saSummary(q){var t=saTotals(q);return {id:q.id,no:q.no||"",kind:saKindOf(q),inv:(q.bill&&q.bill.inv)||"",date:q.date||"",status:q.status||"draft",client:(q.cl&&q.cl.name)||"",cl:q.cl||{},subj:q.subj||"",per:q.per||"",conId:q.conId||"",
  net:t.net,total:t.total,n:(q.lines||[]).length,author:q.author||"",by:q.by||"",updatedAt:q.updatedAt||0,svc:q.src?(q.src.repno||"servis"):"",site:q.src&&q.src.site?q.src.site:"",contractId:q.src?q.src.contractId:"",zero:(q.lines||[]).some(function(l){return !saNum(l.price)}),
  bill:(q.bill&&q.bill.st)||"",nocon:!!(q.src&&q.src.nocon&&!q.del),billDoc:(q.bill&&q.bill.doc)||"",adv:saNum(q.terms&&q.terms.adv),bpct:q.bill&&q.bill.st==="part"?saNum(q.bill.pct):0,bsum:q.bill&&q.bill.st==="part"?saNum(q.bill.sum):0,due:!!((q.status==="accepted"||q.status==="done")&&!(q.bill&&q.bill.st==="paid")&&!(q.src&&q.src.nocon)&&!q.billedIn&&!(q.src&&q.src.type==="service"&&q.src.contractId&&(q.billedIn||!(q.bill&&q.bill.st)))),
  wk:q.src&&q.src.type==="service"&&q.src.contractId?1:0,bin:q.billedIn?(q.billedIn.no||"✓"):"",boff:q.billedIn&&q.billedIn.offer?1:0,srcT:(q.src&&q.src.type)||"",binId:q.billedIn?q.billedIn.id:"",skey:q.src?String(q.src.skey!==undefined&&q.src.skey!==""?q.src.skey:(q.src.site||"")):"",sdate:(q.src&&q.src.date)||"",bmon:q.src&&q.src.type==="bill"?(q.src.month||""):"",nrec:q.src&&q.src.type==="bill"?(q.src.recs||[]).length:0,delAt:q.del?saNum(q.delAt||q.updatedAt):0,delBy:q.del?(q.delBy||q.by||""):"",rev:q.src&&q.src.rev?1:0,dup:q.src&&q.src.dup?(q.src.dup.no||"?"):""}}
/* purchase prices written on quote lines are seen only by accounting */
function saPubQuote(q,role){if(!q||SA_CAN.seeCost(role))return q;var o={};for(var k in q)o[k]=q[k];o.lines=(q.lines||[]).map(function(l){var c={};for(var k in l)if(k!=="cost")c[k]=l[k];return c});return o}
/* a quote that has gone further than a draft offer: deleting it needs the manager's deletion password */
function saProtected(db,q){if(q.status==="accepted"||q.status==="done"||q.bill||(q.src&&q.src.type==="service"))return true;
  return db.moves.some(function(m){return !m.del&&m.kind==="out"&&m.quoteId===q.id})}
/* contract price row for one serviced device: serial № first, then the object + device name */
function saTok(x){return String(x||"").toLowerCase().replace(/kva/g," kva ").split(/[^0-9a-zəöüğıçşа-я.]+/i).filter(function(t){return t&&t.length>1||/\d/.test(t)})}
var SA_GENERIC=["ups","kva","kw","generator","stabilizator","ats","avr","duzlendirici","kompensator","cihaz","online"];
function saKva(x){var m=/(\d+(?:[.,]\d+)?)\s*kva/i.exec(String(x||""));return m?parseFloat(m[1].replace(",",".")):null}
/* one word equals another, or differs by one letter (typos like "Socomee" / "Socomec") */
function saLev1(a,b){if(a===b)return true;if(a.length<5||b.length<5||Math.abs(a.length-b.length)>1||/\d/.test(a)||/\d/.test(b))return false;
  var i=0,j=0,d=0;while(i<a.length&&j<b.length){if(a.charAt(i)===b.charAt(j)){i++;j++;continue}if(++d>1)return false;if(a.length>b.length)i++;else if(b.length>a.length)j++;else{i++;j++}}return d+(a.length-i)+(b.length-j)<=1}
/* a row can be used as many times as its count (Say) */
function saRowCap(r){return Math.max(1,Math.round(saNum(r&&r.n))||1)}
/* the same "serial" in several rows is not a serial number (often the e-qaimə service code pasted by mistake) */
function saFakeSn(L){var c={},o={},snn=function(x){return String(x||"").toLowerCase().replace(/\s+/g,"")};L.forEach(function(r){var k=snn(r.sn);if(k)c[k]=(c[k]||0)+1});for(var k in c)if(c[k]>1)o[k]=1;return o}
function saPriceRow(con,site,d,used){var L=con.plist||[],i=d.info||d.ups||{},snn=function(x){return String(x||"").toLowerCase().replace(/\s+/g,"")},sn=snn(i.sn),best=-1,bs=0,fake=saFakeSn(L);
  var free=function(k){return (used[k]||0)<saRowCap(L[k])},rsn=function(r){var x=snn(r.sn);return fake[x]?"":x};
  if(sn)for(var k=0;k<L.length;k++)if(free(k)&&rsn(L[k])===sn)return k;
  var kv=i.kva!==undefined&&String(i.kva).trim()!==""?parseFloat(String(i.kva).replace(",",".")):null;
  var sites={};L.forEach(function(r){if(r.site)sites[saNormName(r.site)]=1});var multi=Object.keys(sites).length>1;
  var loc=String(d.loc||"").trim(),siteHit=function(r){return !r.site||(!site&&!loc)||saNameHit(r.site,site,true)||(loc&&saNameHit(r.site,loc,true))},kvaOk=function(r){var rk=saKva(r.name);return kv===null||isNaN(kv)||rk===null||Math.abs(rk-kv)<0.01};
  var dt=saTok([i.brand,i.model,kv!==null?kv+" kva":""].join(" ")).map(saNormName).filter(function(t){return SA_GENERIC.indexOf(t)<0});
  var hit=function(t,arr){for(var z=0;z<arr.length;z++)if(saLev1(t,arr[z]))return true;return false};
  for(var k2=0;k2<L.length;k2++){var r=L[k2];if(!free(k2)||!kvaOk(r))continue;var sh=siteHit(r);if(!sh&&multi)continue;
    var rt=saTok(r.name).map(saNormName).filter(function(t){return SA_GENERIC.indexOf(t)<0}),sc=rt.filter(function(t){return hit(t,dt)}).length+(r.site&&sh?0.5:0)-(sh?0:0.5)-(rsn(r)&&sn?0.6:0);
    if(sc>bs){bs=sc;best=k2}}
  if(best>=0&&bs>=1)return best;
  /* one device left for this object (same kVA if known): take it */
  var cand=[];for(var k3=0;k3<L.length;k3++){var r3=L[k3];if(free(k3)&&!(rsn(r3)&&sn)&&siteHit(r3)&&kvaOk(r3))cand.push(k3)}
  return cand.length===1?cand[0]:-1}
var SA_DEVTYPE={ups:"UPS",avr:"ATS AVR",gen:"generator",svr:"stabilizator",rect:"düzləndirici",pfc:"kompensator"};
function saDevName(d){var i=d.info||d.ups||{};return ([i.brand,i.model].filter(Boolean).join(" ")+(i.kva?" "+i.kva+" kVA":"")).trim()||SA_DEVTYPE[d.type]||"Cihaz"}
/* compact copy of the serviced devices, kept on the sale so it can be priced later from a contract */
function saDevsOf(devs){return devs.map(function(d){var i=d.info||d.ups||{};return {type:saStr(d.type,10),loc:saStr(d.loc,160),info:{brand:saStr(i.brand,60),model:saStr(i.model,80),kva:saStr(i.kva,20),sn:saStr(i.sn,60)}}})}
/* one service line per device, priced from the contract's device list (or one line at the contract's visit price) */
function saDevLine(d){var i=d.info||d.ups||{};return [i.sn?"SN "+saStr(i.sn,60):"",d.loc?saStr(d.loc,160):""].filter(Boolean).join(" · ")}
function saContractLines(con,site,devs,info){var cname="Texniki xidmət — "+SA_PERIOD[saObjPer(con,site)][0].toLowerCase()+" müqavilə"+(con.no?" № "+con.no:""),lines=[];
  if(con.plist&&con.plist.length){var used={};

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const pad2=n=>String(n).padStart(2,"0");
const today=()=>{const d=new Date();return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())};
const dayOf=ts=>{const d=new Date(ts);return isNaN(d)?"":d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())};
function fmtDate(iso){const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso||"");return m?m[3]+"."+m[2]+"."+m[1]:""}
function addDays(iso,n){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||"");if(!m)return "";const d=new Date(+m[1],+m[2]-1,+m[3]+Math.round(saNum(n)));return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())}
function money(n){n=saR2(saNum(n));const neg=n<0,[i,f]=Math.abs(n).toFixed(2).split(".");return (neg?"−":"")+i.replace(/\B(?=(\d{3})+(?!\d))/g," ")+","+f}
const AZN=n=>money(n)+" ₼";
function qf(n){n=saR2(saNum(n));return String(n).replace(".",",")}
const qx=n=>String(Math.round(saNum(n)*1e6)/1e6).replace(".",",");

/* ================= e-qaimə-faktura PDF → lines =================
   Works on the text pieces pdf.js gives ({str,x,y,page}); no fixed column positions:
   a goods row starts with its row number (1, 2, 3 …); in that row the quantity, unit price and
   line total are the three numbers where quantity × price = total. VAT = the number ≈ 18% of the total. */
const INV_UNITS=["ədəd","eded","ədəd.","dəst","dest","komplekt","kompl","metr","m","m2","m²","m3","kq","kg","qram","litr","l","ton","rulon","qutu","paket","cüt","cut","saat","xidmət","xidmet","əd","ed","pcs","set"];
function invNum(t){t=String(t).trim();if(!/^-?[\d\s.,]+$/.test(t)||!/\d/.test(t))return null;
  let s=t.replace(/\s/g,"");const c=s.lastIndexOf(","),d=s.lastIndexOf(".");
  if(c>=0&&d>=0){s=c>d?s.replace(/\./g,"").replace(",","."):s.replace(/,/g,"")}
  else if(c>=0){s=/,\d{3}$/.test(s)&&s.split(",").length>2?s.replace(/,/g,""):s.replace(",",".")}
  else if(d>=0&&s.split(".").length>2)s=s.replace(/\./g,"");
  const n=parseFloat(s);return isFinite(n)?n:null}
function invLines(items){/* items → text lines per page, top to bottom; neighbouring pieces on a line are joined */
  const byPage={};items.forEach(it=>{if(!String(it.str).trim())return;(byPage[it.page]=byPage[it.page]||[]).push(it)});
  const out=[];Object.keys(byPage).sort((a,b)=>a-b).forEach(pg=>{const its=byPage[pg].sort((a,b)=>b.y-a.y||a.x-b.x);let cur=null;
    its.forEach(it=>{if(!cur||Math.abs(cur.y-it.y)>3){cur={page:+pg,y:it.y,toks:[]};out.push(cur)}cur.toks.push(it)});
    out.forEach(l=>{if(l.page!==+pg)return;l.toks.sort((a,b)=>a.x-b.x);const m=[];l.toks.forEach(t=>{const p=m[m.length-1];
      const gap=p?t.x-(p.x+p.w):99;
      if(p&&gap<1.2&&!(invNum(p.str)!==null&&invNum(t.str)!==null&&gap>0.4)){p.str+=t.str;p.w=t.x+t.w-p.x}
      /* a thousands group printed as its own piece ("8" + "160,00" → 8 160,00) */
      else if(p&&gap<6&&/^\d{1,3}( \d{3})*$/.test(p.str.trim())&&/^\d{3}([.,]\d{1,4})?$/.test(t.str.trim())){p.str=p.str.trim()+" "+t.str.trim();p.w=t.x+t.w-p.x}
      else m.push({str:t.str,x:t.x,w:t.w||t.str.length*4,y:t.y})});
      /* a number printed one digit per box (VÖEN on e-taxes forms): 9+ single digits in a row become one token */
      const z=[];for(let a=0;a<m.length;){let b=a;while(b<m.length&&/^\d$/.test(m[b].str.trim())&&(b===a||m[b].x-m[b-1].x<26))b++;
        /* digit boxes are evenly and closely spaced; single-digit table cells (qty 5, price 1, sum 5 …) are far apart and are not merged */
        if(b-a>=9){const g=[];for(let c=a+1;c<b;c++)g.push(m[c].x-m[c-1].x);if(Math.max(...g)-Math.min(...g)>5)b=a+1}
        if(b-a>=9){z.push({str:m.slice(a,b).map(x=>x.str.trim()).join(""),x:m[a].x,w:m[b-1].x+m[b-1].w-m[a].x,y:m[a].y});a=b}else{z.push(m[a]);a++}}
      l.toks=z})});
  return out}
function parseInvoiceText(items,opts){opts=opts||{};const lines=invLines(items),full=lines.map(l=>l.toks.map(t=>t.str).join(" ")).join("\n");

function bindInvLines(v){$$("#invLines .lcard").forEach(c=>{const i=+c.dataset.i,l=v.lines[i];

function saveInv(v,approve){
  if(!String(v.no).trim()){toast(ERR.invno);return}if(!String(v.supplier).trim()){toast(ERR.supplier);return}if(!v.lines.length){toast(ERR.empty);return}
  const bad=v.lines.findIndex(l=>!l.itemId&&!l.isNew);if(bad>=0){toast((bad+1)+"-ci sətir: kataloqdan mal seçin və ya “Yeni mal kimi yarat”");return}
  const dup=(state.invoices||[]).find(x=>x.id!==v.id&&x.no.toLowerCase()===String(v.no).trim().toLowerCase()&&(x.voen===v.voen||norm(x.supplier)===norm(v.supplier)));if(dup){toast(ERR.dupinv({no:v.no}));return}
  /* new catalog items first (they go to the server before the invoice) */
  for(const l of v.lines.filter(l=>l.isNew)){let code=String(l.newCode||"").trim();
    if(!code){const base=(l.srcCode&&!/^\d{8,}$/.test(l.srcCode)?l.srcCode:"Q-"+saNormName(l.newName||l.srcName).toUpperCase().split(" ").filter(Boolean).slice(0,3).join("-")).slice(0,40);code=base;let n=2;while(state.items.some(x=>x.code.toLowerCase()===code.toLowerCase()))code=base+"-"+(n++)}
    const err=localSaveItem({code,name:String(l.newName||l.srcName).trim(),unit:l.unit||"ədəd",cat:l.svc?"Xidmət":"",brand:"",model:"",desc:"",min:0,svc:!!l.svc,active:true,cost:l.price,price:0},null,true);
    if(err){toast(code+": "+err);return}const it=state.items.find(x=>x.id===localSaveItem.lastId);l.itemId=it.id;l.isNew=false;l.how="yeni"}
  if(v.imp&&can("seeCost"))impRecalc(v);
  const now=Date.now(),wasNew=!!v.isNew,rec={id:v.id,no:String(v.no).trim(),date:v.date,supplier:String(v.supplier).trim(),voen:String(v.voen||"").replace(/\D/g,""),note:v.note||"",
    lines:v.lines.map(l=>({id:l.id,itemId:l.itemId,srcName:l.srcName,srcCode:l.srcCode,unit:l.unit,qty:saNum(l.qty),price:saNum(l.price),vat:saNum(l.vat),...(v.imp?{fprice:saNum(l.fprice)}:{})})),...(v.imp?{imp:clone(v.imp)}:{})};
  const I=itemsById(),old=(state.invoices||[]).find(x=>x.id===v.id);
  const loc={...(old||{status:"draft",created:now,author:state.me.name}),...rec,lines:rec.lines.map(l=>({...l,code:(I[l.itemId]||{}).code,name:(I[l.itemId]||{}).name,recv:null})),updatedAt:now,by:state.me.name,pending:true};
  if(old&&old.status==="approved"&&!approve)loc.status="approved";
  queueOp("saveInvoice",{invoice:rec,keepStatus:loc.status==="approved"},approve?"":"Qaimə saxlanıldı");
  if(approve){loc.status="approved";loc.approvedBy=state.me.name;loc.returnNote="";
    loc.lines.forEach(l=>{const it=I[l.itemId];if(!it)return;if(l.price>0&&can("seeCost"))it.cost=l.price;const nn=saNormName(l.srcName),al=it.alias?String(it.alias).split("|"):[];if(nn&&!al.includes(nn)){al.push(nn);it.alias=al.join("|")}});
    queueOp("approveInvoice",{id:v.id},"Qaimə təsdiqləndi — anbardara göndərildi")}
  state.invoices=[loc,...(state.invoices||[]).filter(x=>x.id!==v.id)];
  if(wasNew&&v.pdfBuf)pdfPut(v.id,{buf:v.pdfBuf,name:v.fileName||"qaime.pdf"});
  saveCache();INV=null;go("invoices")}

  const X=listExp().filter(x=>monthOf(x.date)===ym),exp=X.reduce((a,x)=>a+saNum(x.amount),0);

<script>/* one window only (Windows app): a second window hands over to the first one and closes */
(function(){try{if(!(location.protocol==="file:"||(/^(localhost|127\.0\.0\.1)$/.test(location.hostname)&&location.port)))return;
  var K="oneapp."+location.pathname.replace(/[^\w]+/g,"_"),me=Math.random().toString(36).slice(2),dup=false,t0=Date.now();
  var put=function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
  addEventListener("storage",function(e){if(!e.newValue)return;var v;try{v=JSON.parse(e.newValue)}catch(x){return}
    if(e.key===K+".ping"&&v.id!==me&&!dup){put(K+".pong",{to:v.id,t:Date.now()});try{window.focus()}catch(x){}
      var o=document.title,n=0,iv=setInterval(function(){document.title=(n%2?o:"● Proqram artıq açıqdır");if(++n>7){clearInterval(iv);document.title=o}},500);

      document.body.innerHTML='<div style="position:fixed;inset:0;display:grid;place-items:center;background:#0f1514;color:#fff;font:16px system-ui,sans-serif;text-align:center;padding:20px"><div><div style="font-size:20px;font-weight:700;margin-bottom:8px">Proqram artıq açıqdır</div><div style="opacity:.8;margin-bottom:16px">Açıq olan pəncərədən istifadə edin (aşağıdakı tapşırıqlar panelində).</div><button onclick="window.close()" style="font-size:15px;padding:10px 18px;border-radius:8px;border:0;cursor:pointer">Bağla</button></div></div>';
      setTimeout(function(){try{window.close()}catch(x){}},1200)}});
  put(K+".ping",{id:me,t:Date.now()})}catch(e){}})();</script>

      ${L.logo?`<div class="grid2"><div style="display:flex;gap:10px;align-items:center"><img src="${L.logo}" alt="" style="height:44px;max-width:170px;object-fit:contain;border:1px solid var(--line);border-radius:6px;padding:2px;background:#fff"><button type="button" class="btn sm" id="lkLogoDel"${dis}>Loqonu sil</button></div>${sel("logoPdf","Loqo sənədlərdə (PDF)")}</div>

      ${adm&&O.teamSend?`<div style="border-top:1px solid var(--line);margin-top:6px;padding-top:10px"><b>Bütün işçilərə</b><p class="note" style="margin:2px 0 6px">Bu görünüşü (rəng, loqo, düymələr, kartlar, funksiyalar) bütün işçilərin proqramına göndərin.${T&&T.at?" Son göndərmə: "+new Date(T.at).toLocaleString("az-AZ"):""}</p>
        <label style="display:flex;gap:8px;align-items:center;cursor:pointer;margin:0 0 8px"><input type="checkbox" id="lkAllow" style="width:16px;height:16px;min-height:0;margin:0"${LSg(KEY+".allow",false)?" checked":""}> İşçilər öz görünüşünü dəyişə bilsin</label>
        <div class="actions"><button type="button" class="btn pri" id="lkSend">📤 Hamıya göndər</button>${T?`<button type="button" class="btn" id="lkUnsend">Ümumi görünüşü ləğv et</button>`:""}</div></div>`:""}

    if(old)old.outerHTML=h;else m.insertAdjacentHTML("beforeend",h);
    const g=id=>document.getElementById(id);
    const save=(L2,redraw)=>{if(!put(L2)){toast("Yadda saxlamaq alınmadı — şəkil çox böyükdür");return}apply();if(redraw)card()};
    const base=()=>Object.assign({},get(),own());

    document.querySelectorAll("[data-pre]").forEach(b=>b.onclick=()=>{const p=PRESETS[+b.dataset.pre][1],cur=own(),L2=Object.assign({},D,{logo:cur.logo||"",logoM:cur.logoM||"both",logoPdf:cur.logoPdf||"1",bgImg:cur.bgImg||""},p);save(L2,true);toast("Üslub: "+PRESETS[+b.dataset.pre][0])});
    const co=g("lkColor");if(co){co.oninput=()=>{const L2=base();L2.acc="custom";L2.accC=co.value;save(L2,false)};co.onchange=()=>card()}
    const bg=g("lkBg");if(bg)bg.onchange=async()=>{const f=bg.files[0];if(!f)return;try{const L2=base();L2.bgImg=await shrink(f,1600,"image/jpeg",0.72);save(L2,true);toast("Arxa fon şəkli qoyuldu")}catch(e){toast("Şəkil oxunmadı")}};
    const op=g("lkOp");if(op){op.oninput=()=>{const L2=base();L2.bgOp=op.value;put(L2);apply()};op.onchange=()=>card()}
    const lg=g("lkLogo");if(lg)lg.onchange=async()=>{const f=lg.files[0];if(!f)return;try{const L2=base();L2.logo=await shrink(f,360,"image/png");save(L2,true);toast("Loqo qoyuldu")}catch(e){toast("Şəkil oxunmadı")}};
    const lh=g("lkLH");if(lh){lh.oninput=()=>{const L2=base();L2.logoH=lh.value;put(L2);apply();const v=g("lkLHv");if(v)v.textContent=lh.value}}
    const ld=g("lkLogoDel");if(ld)ld.onclick=()=>{const L2=base();L2.logo="";save(L2,true)};

    const sd=g("lkSend");if(sd)sd.onclick=()=>teamSend(sd);
    const us=g("lkUnsend");if(us)us.onclick=async()=>{us.disabled=true;try{await O.teamSend(null);localStorage.removeItem(KEY+".team");toast("Ümumi görünüş ləğv edildi — hər kəs öz görünüşünü seçir");card()}catch(e){toast("Alınmadı — internet / server");us.disabled=false}};
    const tm=g("lkTeam");if(tm)tm.onclick=()=>{localStorage.removeItem(KEY);apply();card();toast("Rəhbərin görünüşü tətbiq olundu")};
    g("lkReset").onclick=()=>{put({});apply();card();if(O.resetTheme)O.resetTheme();toast("Standart görünüş qaytarıldı")}}
  function init(prefix,opts){KEY=prefix+".look";O=opts||{};apply();
    const t=document.getElementById("hTitle");if(t&&window.MutationObserver)new MutationObserver(()=>{if(get().logo&&!document.getElementById("zsLogo"))apply()}).observe(t.parentNode,{childList:true});

    setInterval(darkTick,60000);setTimeout(splash,0);setTimeout(teamPull,4000);setInterval(teamPull,30*60000);window.addEventListener("resize",()=>{if(O.onResize)O.onResize()})}
  return {init,apply,card,get,pdfLogo,okAnim,skeleton,nav,NI,bars,hbars,teamPull,mob}})();
</script>
<script>/* ZUVAND — ehtiyat nüsxə (backup): əl ilə və ya avtomatik (hər gün / həftə / ay); ZUVAND Servis-də bərpa */
window.ZSBK=(function(){
  let O=null,busy=false;
  const LSg=k=>{try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}},LSs=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
  const K=s=>O.ls+".bk."+s;
  const pad=n=>String(n).padStart(2,"0"),stamp=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"-"+pad(d.getHours())+pad(d.getMinutes());
  const fmt=iso=>{if(!iso)return "—";const d=new Date(iso);return pad(d.getDate())+"."+pad(d.getMonth()+1)+"."+d.getFullYear()+" "+pad(d.getHours())+":"+pad(d.getMinutes())};
  const FREQ=[["","Söndürülüb"],["d","Hər gün"],["w","Hər həftə"],["m","Hər ay"]];
  function due(){const f=LSg(K("freq"));if(!f)return false;const l=LSg(K("last"));if(!l)return true;const a=new Date(l),n=new Date(),days=(n-a)/864e5;
    if(f==="d")return a.toDateString()!==n.toDateString();if(f==="w")return days>=7-0.01;return a.getFullYear()!==n.getFullYear()||a.getMonth()!==n.getMonth()}
  async function dirH(){try{return O.canDir()?await O.fidb("readonly",st=>st.get("bkroot"))||null:null}catch(e){return null}}
  async function pickDir(){const h=await showDirectoryPicker({id:O.ls+"-bk",mode:"readwrite"});await O.fidb("readwrite",st=>st.put(h,"bkroot"));LSs(K("dir"),h.name);return h}
  async function write(blob,name,silent){
    const h=await dirH();
    if(h){let p=await h.queryPermission({mode:"readwrite"});if(p!=="granted"&&!silent){try{p=await h.requestPermission({mode:"readwrite"})}catch(e){}}
      if(p==="granted"){const fh=await h.getFileHandle(name,{create:true}),w=await fh.createWritable();await w.write(blob);await w.close();return h.name+"\\"+name}}
    if(silent)return null;await O.saveFile(name,blob);return "Yükləmələr / paylaşım: "+name}
  async function run(silent){if(busy)return;busy=true;const msg=t=>{const e=document.getElementById("bkMsg");if(e)e.textContent=t};
    try{msg("Məlumatlar toplanır…");const data=await O.collect(!!LSg(K("ph"))&&!silent,(i,n)=>msg("Toplanır: "+i+" / "+n));
      const B=Object.assign({kind:"zuvand-backup",app:O.app,v:1,at:new Date().toISOString(),by:O.who(),from:O.hub?"hub":"server"},data);
      const name=O.file+"-ehtiyat-"+stamp(new Date())+".json",blob=new Blob([JSON.stringify(B)],{type:"application/json"});
      const where=await write(blob,name,silent);
      if(!where){busy=false;return false}
      LSs(K("last"),B.at);O.toast("Ehtiyat nüsxə saxlanıldı: "+where+" ("+Math.round(blob.size/1024)+" KB)");msg("Saxlanıldı: "+where);busy=false;if(document.getElementById("bkCard"))card();return true}
    catch(e){busy=false;msg("Alınmadı: "+(e&&e.message||e));if(!silent)O.toast("Ehtiyat nüsxə alınmadı: "+(O.err?O.err(e):(e&&e.message||e)));return false}}
  /* automatic: when the time has come — silently into the chosen folder; otherwise a reminder (or a download on a computer) */
  async function tick(){try{if(!O||!O.isAdmin()||!O.ready()||!due())return;const ok=await run(true);if(ok)return;
      const t=new Date().toDateString();if(LSg(K("nag"))===t)return;LSs(K("nag"),t);
      if(!O.mobile&&!O.canDir()){await run(false);return}
      O.toast("Ehtiyat nüsxə vaxtıdır — Ayarlar → “Ehtiyat nüsxə” → “İndi çıxar”"+(O.canDir()?" (qovluq seçsəniz, sonra avtomatik yazılacaq)":""),9000)}catch(e){}}
  async function restore(file){const msg=t=>{const e=document.getElementById("bkMsg");if(e)e.innerHTML=t};
    let B;try{B=JSON.parse(await file.text())}catch(e){O.toast("Fayl oxunmadı — JSON ehtiyat nüsxəsi deyil");return}
    const ok=O.accept(B);if(!ok){O.toast("Bu fayl "+O.title+" ehtiyat nüsxəsi deyil");return}
    const box=document.getElementById("bkAsk");if(!box)return;
    box.hidden=false;box.innerHTML=`<p style="margin:0 0 6px"><b>${O.esc(file.name)}</b> · ${fmt(B.at)}${B.by?" · "+O.esc(B.by):""}<br>${O.esc(ok)}</p><p class="note" style="margin:0 0 8px">${O.esc(O.restoreNote)}</p>
      <div class="actions"><button class="btn pri" id="bkGo">Bəli, bərpa et</button><button class="btn" id="bkNo">Ləğv et</button></div>`;
    document.getElementById("bkNo").onclick=()=>{box.hidden=true};
    document.getElementById("bkGo").onclick=async()=>{box.hidden=true;busy=true;
      try{const r=await O.restore(B,(i,n,t)=>msg((t||"Bərpa olunur")+": "+i+" / "+n));msg("Bərpa olundu: "+O.esc(r||""));O.toast("Ehtiyat nüsxə bərpa olundu"+(r?": "+r:""),8000)}
      catch(e){msg("Bərpa alınmadı: "+O.esc(O.err?O.err(e):(e&&e.message||e)))}busy=false}}
  function card(){const m=document.getElementById("main");if(!m)return;const old=document.getElementById("bkCard");
    const adm=O.isAdmin(),f=LSg(K("freq"))||"",dn=LSg(K("dir")),last=LSg(K("last"));
    const h=`<div class="card" id="bkCard" style="margin-top:12px"><h3>Ehtiyat nüsxə (backup)</h3>
      ${adm?`<p class="note" style="margin:0 0 8px">${O.esc(O.what)} bir JSON faylına yazılır. Avtomatik rejimdə proqram açıq olanda vaxtı gələndə özü çıxarır${O.canDir()?" — seçilmiş qovluğa":""}. Fayl ZUVAND Servis-də “Ehtiyat nüsxədən bərpa et” ilə geri yüklənir.</p>
      <div class="actions"><button class="btn pri" id="bkNow">İndi ehtiyat nüsxə çıxar</button>${O.canDir()?`<button class="btn" id="bkDir">${dn?"Qovluğu dəyiş":"Qovluq seç"}</button>`:""}</div>
      <label class="f" style="max-width:320px"><span>Avtomatik ehtiyat nüsxə</span><select id="bkFreq">${FREQ.map(([k,l])=>`<option value="${k}"${k===f?" selected":""}>${l}</option>`).join("")}</select></label>
      ${O.photos?`<label style="display:flex;gap:8px;align-items:center;cursor:pointer;margin:4px 0"><input type="checkbox" id="bkPh" style="width:16px;height:16px;min-height:0;margin:0"${LSg(K("ph"))?" checked":""}> Şəkilləri də daxil et (əl ilə çıxaranda; fayl xeyli böyük olur)</label>`:""}
      <p class="note" style="margin:4px 0 0">Son ehtiyat nüsxə: <b>${fmt(last)}</b>${f?" · növbəti: "+(due()?"<b>indi</b>":({d:"sabah",w:"1 həftəyə",m:"gələn ay"})[f]):""}${O.canDir()?" · qovluq: <b>"+O.esc(dn||"seçilməyib (Yükləmələr qovluğu)")+"</b>":""}</p>`
      :`<p class="note" style="margin:0">Ehtiyat nüsxəni yalnız rəhbər çıxara bilər.</p>`}
      ${adm&&O.hub&&O.restore?`<div style="border-top:1px solid var(--line);margin-top:10px;padding-top:10px"><b>Ehtiyat nüsxədən bərpa et</b><p class="note" style="margin:2px 0 6px">${O.esc(O.restoreHelp)}</p>
        <label class="btn" style="display:inline-flex;align-items:center;cursor:pointer">Fayl seç (.json)<input type="file" id="bkFile" accept=".json,application/json" hidden></label><div id="bkAsk" class="banner" hidden style="margin-top:8px"></div></div>`:""}
      <p class="note" id="bkMsg" style="margin:6px 0 0"></p></div>`;
    if(old)old.outerHTML=h;else m.insertAdjacentHTML("beforeend",h);
    const g=id=>document.getElementById(id);
    if(g("bkNow"))g("bkNow").onclick=()=>run(false);
    if(g("bkDir"))g("bkDir").onclick=async()=>{try{await pickDir();card();O.toast("Ehtiyat nüsxələr bu qovluğa yazılacaq")}catch(e){}};
    if(g("bkFreq"))g("bkFreq").onchange=e=>{LSs(K("freq"),e.target.value);card();O.toast(e.target.value?"Avtomatik ehtiyat nüsxə: "+FREQ.find(x=>x[0]===e.target.value)[1].toLowerCase():"Avtomatik ehtiyat nüsxə söndürüldü");setTimeout(tick,1500)};
    if(g("bkPh"))g("bkPh").onchange=e=>LSs(K("ph"),e.target.checked);
    if(g("bkFile"))g("bkFile").onchange=e=>{const f=e.target.files&&e.target.files[0];e.target.value="";if(f)restore(f)}}
  function init(o){O=o;setTimeout(tick,25000);setInterval(tick,30*60000)}
  return {init,card,run,tick,due}})();
</script>
<script>/* Satış və Anbar: görünüş + ehtiyat nüsxə (Ayarlarda), ZUVAND Servis-də bərpa */
(function(){try{
  ZSBK.init({app:"satis-anbar",ls:"sa",file:"Satis-Anbar",title:"Satış və Anbar",hub:!!CFG.hub,photos:false,
    what:"Bütün kataloq, anbar qalığı və hərəkətləri, təkliflər və satışlar, qaimələr, müqavilələr, xərclər və ayarlar",
    mobile:IS_APP||IS_IOS||/Android/i.test(navigator.userAgent),isAdmin:()=>can("admin"),ready:()=>!!state.me.name,who:()=>state.me.name||"",
    canDir:()=>canDir(),fidb:(m,f)=>fidb(m,f),saveFile:(n,b)=>saveFile(n,b),toast:(t,ms)=>toast(t,ms),esc:x=>esc(x),err:e=>errMsg(e),
    collect:async()=>{const r=await api("backup");return {db:r.db}},

    restore:async(B,prog)=>{prog(1,1,"Göndərilir");const r=await api("restoreAll",{db:B.db});
      state.local={};state.pending.clear();try{saveLocal()}catch(e){}state.outbox=[];try{saveOutbox()}catch(e){}state.lastSync=0;try{saveCache()}catch(e){}

  const _rs=renderSettings;renderSettings=function(){const r=_rs.apply(this,arguments);try{ZSLOOK.card((t,ms)=>toast(t,ms),x=>esc(x))}catch(e){}try{svcSyncCard()}catch(e){}try{renCard()}catch(e){}try{ZSBK.card()}catch(e){}try{ZSUPD.card()}catch(e){}try{ZSSEC.card()}catch(e){}try{ZSCOL.on()}catch(e){}return r};
  try{ZSUPD.init({toast:(t,ms)=>toast(t,ms),isAdmin:()=>can("admin"),hub:()=>!!CFG.hub,gas:()=>IS_GAS,key:()=>state.me.key})}catch(e){}try{ZSSEC.init({app:"sa",api:(a,p)=>api(a,p),toast:(t,ms)=>toast(t,ms),logged:()=>!isDemo()&&!!state.me.key,hub:()=>!!CFG.hub,onPw:h=>{if(!CFG.hub){state.delPw=h;state.hasDelPw=true;try{saveCache()}catch(e){}}}})}catch(e){}
}catch(e){console.log("look/backup",e)}})();
</script>
<script>/* Satış və Anbar: göstəricilər, statistika, aşağı menyu, status rəngi, PDF loqo, rəhbərin görünüşü, animasiyalar */
(function(){try{
  const LOGO0=LOGO;
  document.head.insertAdjacentHTML("beforeend",`<style>.rcard[data-st]{border-left:5px solid var(--line)!important}.rcard[data-st^=sent]{border-left-color:#2B6CB0!important}.rcard[data-st^=accepted]{border-left-color:var(--ok)!important}.rcard[data-st^=done]{border-left-color:#145C38!important}.rcard[data-st^=rejected]{border-left-color:var(--bad)!important}.rcard[data-st~=due]{border-left-color:#D4A017!important}</style>`);
  const mon=()=>today().slice(0,7);
  function kpi(){const v=state.view;if(!["svcbill","quotes","stock","stats"].includes(v)||document.getElementById("zsKpi"))return;const m=document.getElementById("main");if(!m||!m.firstElementChild)return;
    const L=listQuotes(),T=[];
    if(can("setPrice")){const due=L.filter(s=>s.due&&s.bill!=="paid");T.push(["pay",AZN(due.reduce((a,s)=>a+saNum(s.total),0)),"ödəniş gözləyir · "+due.length+" sənəd",due.length?"warn":""]);
      const ms=L.filter(s=>(s.status==="accepted"||s.status==="done")&&!s.wk&&String(s.date||"").startsWith(mon()));T.push(["sale",AZN(ms.reduce((a,s)=>a+saNum(s.total),0)),"bu ayın satışı (qəbul edilmiş)","ok"])}
    if(can("setPrice")||can("contract"))T.push(["svc",sbOpen(),"aylıq hesaba gözləyən servis",sbOpen()?"warn":""]);
    if(MAIN_TABS().some(x=>x[0]==="stock"))T.push(["low",lowCount(),"az qalan mal",lowCount()?"bad":""]);
    if(!T.length)return;
    m.insertAdjacentHTML("afterbegin",`<div class="zs-kpis" id="zsKpi">${T.map(([k,val,l,c])=>`<button type="button" class="zs-kpi ${c}" data-kpi="${k}"><b>${val}</b><span>${l}</span></button>`).join("")}</div>`);
    m.querySelectorAll("[data-kpi]").forEach(b=>b.onclick=()=>{const k=b.dataset.kpi;
      if(k==="pay"){const due=L.filter(s=>s.due&&s.bill!=="paid"),sv=due.filter(s=>qKind(s)==="svc").length;state.qf="pay";state.qpay="all";goSub(sv>due.length-sv?"quotes:svc":"quotes:sale")}
      else if(k==="sale"){state.qf="accepted";goSub("quotes:sale")}else if(k==="svc")goSub("svcbill");else if(k==="low"){state.sf="low";goSub("stock")}})}
  function skel(){if(state.view!=="quotes"||state.lastSync||isDemo())return;const e=document.querySelector("#main .empty");if(e)e.outerHTML=`<p class="note" style="margin:0 0 8px">Məlumat serverdən yüklənir…</p>`+ZSLOOK.skeleton(3)}
  /* statistics */
  window.renderSaStats=function(){mainTabs("stats");const L=listQuotes().filter(s=>s.status==="accepted"||s.status==="done"),now=new Date(),M=[];
    for(let i=11;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);M.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"))}
    const MN=["Yan","Fev","Mar","Apr","May","İyn","İyl","Avq","Sen","Okt","Noy","Dek"],inM=(s,m)=>String(s.date||"").startsWith(m),rev=L.filter(s=>!s.wk);
    const k=n=>n>=10000?Math.round(n/1000)+"k":String(Math.round(n));
    const d1=M.map(m=>({l:MN[+m.slice(5)-1],v:rev.filter(s=>inM(s,m)&&qKind(s)==="sale").reduce((a,s)=>a+saNum(s.total),0),v2:rev.filter(s=>inM(s,m)&&qKind(s)==="svc").reduce((a,s)=>a+saNum(s.total),0)}));
    const d2=M.map(m=>({l:MN[+m.slice(5)-1],v:rev.filter(s=>inM(s,m)).reduce((a,s)=>a+saNum(s.total),0),v2:rev.filter(s=>inM(s,m)&&s.bill==="paid").reduce((a,s)=>a+saNum(s.total),0)}));
    const cl={};rev.filter(s=>String(s.date||"")>=M[0]).forEach(s=>{const c=String(s.client||"").trim();if(c)cl[c]=(cl[c]||0)+saNum(s.total)});
    const top=(o,n)=>Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,n).map(([x,v])=>[esc(x),v]);
    const cat={};if(can("seeCost"))state.items.filter(i=>!i.svc&&i.active!==false).forEach(i=>{const q=stk(i.id).q;if(q>0){const c=catOf(i)||"Kateqoriyasız";cat[c]=(cat[c]||0)+q*saNum(i.cost)}});
    $("#main").innerHTML=`<h2 class="sec">Statistika</h2><p class="hint">Qəbul edilmiş və təhvil verilmiş sənədlər üzrə, son 12 ay (ƏDV daxil).</p>
      <div class="zs-chart"><h3>Aylıq satış, ₼</h3>${ZSLOOK.bars(d1,{fmt:k,legend:'<span class="chip" style="background:var(--accent);color:var(--accent-ink)">mal / avadanlıq</span> <span class="chip">servis</span>'})}</div>
      <div class="zs-chart"><h3>Satış və ödəniş, ₼</h3>${ZSLOOK.bars(d2,{pair:1,fmt:k,legend:'<span class="chip" style="background:var(--accent);color:var(--accent-ink)">satış</span> <span class="chip">ödənilib</span>'})}</div>
      <div class="cols2"><div class="col"><div class="zs-chart"><h3>Ən böyük müştərilər (12 ay)</h3>${Object.keys(cl).length?ZSLOOK.hbars(top(cl,10),AZN):'<p class="note">Məlumat yoxdur.</p>'}</div></div>
      <div class="col">${can("seeCost")?`<div class="zs-chart"><h3>Anbar dəyəri kateqoriyalar üzrə (maya)</h3>${Object.keys(cat).length?ZSLOOK.hbars(top(cat,10),AZN):'<p class="note">Anbar boşdur.</p>'}</div>`:""}</div></div>`;
    window.scrollTo(0,0)};
  /* bottom bar on phones: the four sections + settings */
  function nav(){const G=grpSubs(),cs=curSub(state.view),inG=G.find(([g,L])=>L.some(x=>x[0]===cs));if(!state.me.name||(!inG&&state.view!=="settings")){ZSLOOK.nav(null);return}
    const I=ZSLOOK.NI,ic={svcb:I.doc,sale:I.cart,wh:I.box,cc:I.users},lb={svcb:"Servis",sale:"Satış",wh:"Anbar",cc:"Müştəri"};
    const it=G.map(([g,L])=>[g,lb[g],ic[g],()=>goSub(L[0][0])]);it.push(["settings","Ayarlar",I.gear,()=>go("settings")]);
    const nb=document.getElementById("bNew");ZSLOOK.nav(it,state.view==="settings"?"settings":inG&&inG[0],nb&&state.view==="quotes"?["Yeni təklif",()=>{const b=document.getElementById("bNew");if(b)b.click()}]:null)}
  ZSLOOK.init("sa",{isAdmin:()=>can("admin"),who:()=>state.me.name||"",name:"Satış və Anbar",sub:"ZUVAND",letter:"S",
    teamGet:async()=>{if(isDemo())return undefined;const r=await api("look_get");return r&&r.look?r.look:null},
    teamSend:async T=>{await api("look_set",{look:T})},resetTheme:()=>{try{applyTheme(LS.get("sa_theme")||"auto")}catch(e){}},
    onApply:()=>{LOGO=ZSLOOK.pdfLogo()||LOGO0},onRender:()=>{kpi();skel();nav()},onResize:()=>nav()});
  const _t=toast;toast=function(m){const r=_t.apply(this,arguments);try{if(/saxlanıldı|təsdiqləndi|hazırlandı|qəbul edildi|bərpa olundu/i.test(String(m)))ZSLOOK.okAnim()}catch(e){}return r};
}catch(e){console.log("zs-ui",e)}})();
</script>
<script>/* Satış və Anbar: mühasib üçün təsdiqlənmiş servis hesabatlarının PDF-ləri (Servis hesabları → Servis hesabatları (PDF)) */
(function(){try{
  const okRole=()=>!isDemo()&&(can("invoice")||can("admin"));
  const IT=["svcpdf","Servis hesabatları (PDF)"];
  const _g=grpSubs;grpSubs=function(){const G=_g.apply(this,arguments);if(!okRole())return G;const s=G.find(x=>x[0]==="svcb");if(s){if(!s[1].some(x=>x[0]==="svcpdf"))s[1].push(IT)}else G.push(["svcb",[IT]]);return G};
  const _r=render;render=function(){if(state.view==="svcpdf"&&okRole()){header();return renderSvcPdf()}return _r.apply(this,arguments)};
  document.head.insertAdjacentHTML("beforeend",`<style>.spl{display:grid;gap:8px}.spl .it{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;background:var(--card,#fff);border:1px solid var(--line,#E2E8E6);border-radius:12px;padding:10px 12px}
    .spl .it b{font-size:15px}.spl .it .m{color:var(--muted,#5B6B67);font-size:13px}.spl .it .btn{white-space:nowrap}.spf{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}.spf input,.spf select{padding:8px;border:1px solid var(--line,#C9D3D0);border-radius:8px;font-size:15px}.spf input{flex:1;min-width:180px}</style>`);
  let L=null,busy=false,Q="",M="";
  const ERRS={svcsheet:"Ayarlarda UPS Servis Jurnalının cədvəli göstərilməyib",forbidden:"Bu bölmə yalnız mühasib və rəhbər üçündür",nopdf:"Bu hesabatın PDF-i serverdə yoxdur",notfound:"Hesabat tapılmadı"};
  const em=e=>ERRS[(e&&e.data&&e.data.error)||(e&&e.message)]||(e&&e.message)||String(e);
  async function load(){busy=true;try{const r=await api("svcPdfs",{});L=r.list||[]}catch(e){L=[];L.err=em(e)}busy=false;if(state.view==="svcpdf")renderSvcPdf()}
  const d2=x=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(x||""));return m?m[3]+"."+m[2]+"."+m[1]:esc(x||"")};
  const MON=["Yanvar","Fevral","Mart","Aprel","May","İyun","İyul","Avqust","Sentyabr","Oktyabr","Noyabr","Dekabr"];
  function shown(){const q=norm(Q);return (L||[]).filter(x=>(!M||String(x.date).slice(0,7)===M)&&(!q||norm([x.no,x.client,x.obj,x.eng,x.payer,x.type].join(" ")).includes(q)))}
  window.renderSvcPdf=function(){mainTabs("svcpdf");const m=$("#main");
    if(!L){m.innerHTML=`<p class="note">Yüklənir…</p>`;if(!busy)load();return}
    const months=[...new Set(L.map(x=>String(x.date).slice(0,7)).filter(x=>/^\d{4}-\d{2}$/.test(x)))].sort().reverse(),S=shown(),withPdf=S.filter(x=>x.pdf);
    m.innerHTML=`<h2 class="sec">Təsdiqlənmiş servis hesabatları</h2><p class="hint">Rəhbərin təsdiqlədiyi servis hesabatlarının PDF-ləri. Təsdiqdən sonra PDF avtomatik serverə yüklənir.</p>
      ${L.err?`<div class="banner">${esc(L.err)}</div>`:""}
      <div class="spf"><input id="spQ" placeholder="Axtar: hesabat №, müştəri, obyekt, mühəndis…" value="${esc(Q)}" aria-label="Axtar"><select id="spM" aria-label="Ay"><option value="">Bütün aylar</option>${months.map(k=>`<option value="${k}"${k===M?" selected":""}>${MON[+k.slice(5)-1]} ${k.slice(0,4)}</option>`).join("")}</select>
        <button class="btn" id="spR">Yenilə</button>${withPdf.length>1?`<button class="btn pri" id="spAll">Hamısını yüklə (${withPdf.length})</button>`:""}</div>
      <div class="spl">${S.map(x=>`<div class="it"><div><b>${esc(x.no||"—")}</b> · ${d2(x.date)} · ${esc(x.client)}${x.obj?" — "+esc(x.obj):""}<div class="m">${esc([x.type,x.eng,x.payer?"vasitəçi: "+x.payer:""].filter(Boolean).join(" · "))}${x.appr?" · təsdiq: "+esc(x.appr):""}</div></div>
        ${x.pdf?`<button class="btn" data-dl="${esc(x.id)}">⬇ PDF</button>`:`<span class="note">PDF yoxdur</span>`}</div>`).join("")||`<p class="note">Hesabat tapılmadı</p>`}</div>
      <p class="note">Göstərilir: ${S.length} hesabat${S.length-withPdf.length?` · ${S.length-withPdf.length}-nin PDF-i yoxdur (rəhbər hesabatı açıb “PDF hazırla” bassa, burada görünəcək)`:""}</p>`;
    const qi=$("#spQ");qi.oninput=()=>{Q=qi.value;clearTimeout(qi._t);qi._t=setTimeout(()=>{const p=qi.selectionStart;renderSvcPdf();const n=$("#spQ");n.focus();try{n.setSelectionRange(p,p)}catch(e){}},300)};
    $("#spM").onchange=e=>{M=e.target.value;renderSvcPdf()};$("#spR").onclick=()=>{L=null;renderSvcPdf()};
    m.querySelectorAll("[data-dl]").forEach(b=>b.onclick=async()=>{const x=L.find(y=>y.id===b.dataset.dl);b.disabled=true;b.textContent="Yüklənir…";await dl(x);b.disabled=false;b.textContent="⬇ PDF"});
    const all=$("#spAll");if(all)all.onclick=async()=>{all.disabled=true;let i=0;for(const x of withPdf){all.textContent="Yüklənir "+(++i)+"/"+withPdf.length;if(!await dl(x))break}all.disabled=false;all.textContent="Hamısını yüklə ("+withPdf.length+")"}};
  async function dl(x){try{const r=await api("svcPdf",{id:x.id});const bin=atob(r.data),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
      const nm=String(r.name||((x.no||"hesabat")+".pdf")).replace(/[\\/:*?"<>|]+/g," ");await saveFile(nm,new Blob([u],{type:"application/pdf"}),x.client);return true}
    catch(e){toast("PDF alınmadı: "+em(e));return false}}
}catch(e){console.log("svcpdf",e)}})();
</script>
